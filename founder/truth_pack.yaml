- id: ev-pf-wc
  content: 'World Cup 2026 Live Prediction Engine (Personal Project), 2025 to 2026. Python, Next.js, PostgreSQL / Supabase. Built and publicly deployed an end-to-end AI platform that forecasts every FIFA World Cup 2026 match and simulates the full tournament with Monte Carlo, scoring users'' brackets against the model. Delivered the full stack, from data pipeline through to a Next.js web app deployed on Vercel and Supabase. Engineered the forecasting model: a Dixon-Coles bivariate-Poisson fit with an Elo prior and host-advantage term, plus Platt / isotonic calibration and a documented fallback hierarchy. Implemented production-grade reproducibility: SHA-256-hashed data sources, fully versioned prediction runs (model, data, and RNG seed), automated pytest tests, and a rollback / recovery runbook, transparently publishing the model''s own backtest and calibration. Live demo https://presaira.com; source https://github.com/m7mdehab/WC2026-Live-Prediction-Engine'
  source: cv
  locator: private/Mohammed_Ehab_CV_June_2026.pdf#projects
- id: ev-pf-sar
  content: 'SAR Satellite Deep-Learning Suite (Graduation Project, Final Grade: A+), 2024. Python, TensorFlow, PyTorch. Developed 5 deep-learning models and 2 web apps using SAR satellite imagery for marine oil-spill detection and optimal solar-installation site selection, achieving a final grade of A+. Source https://github.com/m7mdehab/oil-spill-detection and https://github.com/m7mdehab/SolarSiteSelection'
  source: cv
  locator: private/Mohammed_Ehab_CV_June_2026.pdf#projects
- id: ev-pf-opos
  content: 'OpportunityOS (Personal Project, 2026, in development): a governed opportunity-discovery and truth-locked application system with PostgreSQL persistence, a FastAPI service and a Next.js founder interface, built with an autonomous multi-agent engineering protocol. Public documentation mirror https://github.com/m7mdehab/opportunityos-docs'
  source: founder_statement
  locator: private/truth_pack.yaml
  assertion_type: user_assertion
  verification_status: approximate
- id: ev-services
  content: 'Engagement types offered: fixed price, time and materials, retainer, fractional. Services: Data migration and reconciliation - source-to-target mapping, transformation and validation rules, profiling, cleansing and reconciliation between source and target systems. Power BI dashboards and reporting - KPI design, recurring performance reports, consolidated multi-source reporting views. Machine learning and AI product development - end-to-end ML and AI products including LLM, RAG and agent applications, forecasting and probabilistic models. Web development and deployment - Next.js and WordPress business and brand websites, e-commerce and brand sites, hosting, domains and analytics on Vercel and Supabase. Digital marketing analytics and reporting - paid-social performance measurement linked to commercial outcomes, multi-brand and agency reporting. Tutoring in Python, Java, data analysis, data science and machine learning. Delivery languages English and Arabic. Available from 2026-10-02 (one month notice; contractual maximum two months). Legal capacity: individual freelancer alongside full-time employment; no registered company, no sole-trader registration, no bid bond capacity. Currencies: USD, EUR, EGP, SAR, AED, CAD. Regions: EG, remote worldwide, AE, SA, QA, KW, BH, OM, CA. Onsite willingness: remote preferred; hybrid and onsite acceptable in Egypt; open to travel and relocation to the GCC and to Canada.'
