  content: Built and improved LLM-powered conversational agents, prompts, tool-calling flows, and agent behaviors for user-facing AI experiences. Implemented RAG and knowledge-base pipelines, including document processing, embeddings, retrieval, and grounded responses over company information. Integrated AI capabilities with Python / FastAPI backends, APIs, and product systems, and tested accuracy, hallucination resistance, latency, reliability, logging, and response quality.
