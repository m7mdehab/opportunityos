    work_mode: remote
    remote_scope: region_restricted
    remote_scope_regions:
    - EU
  description: Named region-restricted remote phrase -> remote, region-restricted ['EU'].
- id: remote_worldwide
  pattern: (?i)\bremote\b.{0,20}\b(?:worldwide|anywhere|global)\b
  sets:
    work_mode: remote
    remote_scope: worldwide
  description: Explicit worldwide/anywhere remote phrasing -> remote, worldwide.
- id: remote_anywhere_remote
  pattern: (?i)\b(?:work\s+from\s+)?anywhere\b
  sets:
    work_mode: remote
    remote_scope: worldwide
  description: Explicit worldwide/anywhere remote phrasing -> remote, worldwide.
- id: hybrid_generic
  pattern: (?i)\bhybrid\b
  sets:
    work_mode: hybrid
  description: Generic 'hybrid' mention with no further qualifier.
- id: onsite_generic
  pattern: (?i)\b(?:on[-\s]?site|in[-\s]?office|onsite)\b
  sets:
    work_mode: onsite
  description: Generic on-site/in-office mention with no further qualifier.
- id: remote_generic
  pattern: (?i)\b(?:remote|work\s+from\s+home|wfh|telecommute|virtual)\b
  sets:
    work_mode: remote
  description: Generic remote mention; remote_scope stays unspecified without a qualifier.
