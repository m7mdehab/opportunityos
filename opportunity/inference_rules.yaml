- id: remote_region_restricted_eu_only
  pattern: (?i)\b(?:eu|european\s+union)\s+only\b
  sets:
    work_mode: remote
    remote_scope: region_restricted
    remote_scope_regions:
    - EU
  description: Named region-restricted remote phrase -> remote, region-restricted ['EU'].
- id: remote_region_restricted_uk_only
  pattern: (?i)\b(?:uk|u\.k\.|united\s+kingdom)\s+only\b
  sets:
    work_mode: remote
    remote_scope: region_restricted
    remote_scope_regions:
    - GB
  description: Named region-restricted remote phrase -> remote, region-restricted ['GB'].
- id: remote_region_restricted_europe_only
  pattern: (?i)\beurope\s+only\b
  sets:
    work_mode: remote
    remote_scope: region_restricted
    remote_scope_regions:
    - EU
  description: Named region-restricted remote phrase -> remote, region-restricted ['EU'].
- id: remote_worldwide
  pattern: (?i)\bremote\b.{0,20}\b(?:worldwide|anywhere|global)\b
  sets:
    work_mode: remote
    remote_scope: worldwide
  description: Explicit worldwide/anywhere remote phrasing -> remote, worldwide.
- id: remote_anywhere_remote
  pattern: (?i)\b(?:work|working|worked)\s+from\s+anywhere\b
  channel: both
  sets:
    work_mode: remote
    remote_scope: worldwide
  description: Explicit work from anywhere remote phrasing -> remote, worldwide.
- id: linkedin_hybrid_tag
  pattern: (?i)#li-hybrid\b
  sets:
    work_mode: hybrid
  channel: both
  description: LinkedIn hashtag in postings -> hybrid
- id: linkedin_remote_tag
  pattern: (?i)#li-remote\b
  sets:
    work_mode: remote
  channel: both
  description: LinkedIn hashtag in postings -> remote
- id: linkedin_onsite_tag
  pattern: (?i)#li-onsite\b
  sets:
    work_mode: onsite
  channel: both
  description: LinkedIn hashtag in postings -> onsite
- id: remote_us_phrases
  pattern: (?i)\b(?:remote[\s,-]+u\.?s\.?a?|u\.?s\.?a?[\s,-]+remote|remote\s+united\s+states)\b
  sets:
    work_mode: remote
    location_country: US
    remote_scope: region_restricted
    remote_scope_regions:
      - US
  channel: both
  description: Remote US phrases -> remote, location_country=US, region_restricted [US]
- id: remote_state_phrases
  pattern: (?i)\bremote\s*-\s*(?:alabama|alaska|arizona|arkansas|california|colorado|connecticut|delaware|florida|georgia|hawaii|idaho|illinois|indiana|iowa|kansas|kentucky|louisiana|maine|maryland|massachusetts|michigan|minnesota|mississippi|missouri|montana|nebraska|nevada|new\s+hampshire|new\s+jersey|new\s+mexico|new\s+york|north\s+carolina|north\s+dakota|ohio|oklahoma|oregon|pennsylvania|rhode\s+island|south\s+carolina|south\s+dakota|tennessee|texas|utah|vermont|virginia|washington|west\s+virginia|wisconsin|wyoming)\b
  sets:
    work_mode: remote
    location_country: US
  channel: both
  description: Remote - <State> -> remote, location_country=US
- id: remote_country_phrases
  pattern: (?i)\b(?:germany\s+remote|remote\s*-\s*cyprus|remote\s*-\s*estonia)\b
  sets:
    work_mode: remote
  channel: both
  description: Remote country phrases -> remote
- id: remote_eligible_phrase
  pattern: (?i)\b(?:u\.?s\.?\s*-\s*remote\s+eligible|remote\s+eligible)\b
  sets:
    work_mode: remote
  channel: both
  description: Remote eligible phrasing -> remote
- id: office_attendance_onsite
  pattern: (?i)\b(?:this\s+(?:role|position|job)\s+requires\s+(?:full-time\s+)?(?:in-office|office)\s+attendance|mandatory\s+(?:in-person\s+|in-office\s+)?office\s+attendance)\b
  sets:
    work_mode: onsite
  channel: both
  description: Mandatory role/candidate office attendance -> onsite
- id: remote_scope_worldwide_bare
  pattern: (?i)\b(?:worldwide|global|anywhere)\b
  sets:
    work_mode: remote
    remote_scope: worldwide
  description: Bare worldwide/global mention in location -> remote, worldwide.
- id: hybrid_generic
  pattern: (?i)\bhybrid\b
  sets:
    work_mode: hybrid
  description: Generic 'hybrid' mention with no further qualifier.
- id: onsite_generic
  pattern: (?i)\b(?:on[-\s]?site|in[-\s]?office|onsite)\b
  sets:
    work_mode: onsite
  description: Generic on-site/in-office mention with no further qualifier.
- id: remote_generic
  pattern: (?i)\b(?:remote|work\s+from\s+home|wfh|telecommute|virtual)\b
  sets:
    work_mode: remote
  description: Generic remote mention; remote_scope stays unspecified without a qualifier.
- id: country_eg
  pattern: (?i)\b(?:Egypt|EGY)\b
  sets:
    location_country: EG
  description: Country-name mention -> location_country=EG.
- id: country_us
  pattern: (?i)\b(?:United States of America|United States|U\.S\.A\.|U\.S\.|USA)\b
