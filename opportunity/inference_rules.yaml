version: 1
description: BRIEF-FR-006 A1 committed, ordered, tested text-inference rule table. Applied only to fields
  an adapter did not already map from a native field (opportunity/normalization.py::apply_inference_rules).
  Rules are evaluated top-to-bottom; the first rule that sets a given field wins for that field, so more
  specific composite rules are listed before generic catch-alls. A new rule can be added here without
  editing Python.
rules:
- id: remote_region_restricted_us_only
  pattern: (?i)remote\s*\(\s*(?:us|u\.s\.|usa|united\s+states)\s+only\s*\)
  sets:
    work_mode: remote
    remote_scope: region_restricted
    remote_scope_regions:
    - US
  description: '''Remote (US only)'' -> remote, region-restricted [US] (worked example 1, verbatim).'
- id: remote_region_restricted_bracket_country_only
  pattern: (?i)remote\s*\(\s*([a-z .,&/]+?)\s+only\s*\)
  sets:
    work_mode: remote
    remote_scope: region_restricted
  region_from_group: 1
  description: 'Generalisation of worked example 1: ''Remote (<country/region list> only)'' -> remote,
    region-restricted [<codes>]. The captured group is resolved token-by-token against the same country/region
    alias tables the static country_*/region rules below use (opportunity/normalization.py::_COUNTRY_ALIASES
    / _REGION_ALIASES).'
- id: hybrid_city_em_dash
  pattern: (?i)hybrid\s*[—–-]\s*cairo
  sets:
    work_mode: hybrid
    location_country: EG
    location_city: Cairo
  description: '''Hybrid — Cairo'' -> hybrid, EG/Cairo (worked example 2).'
- id: onsite_multi_country_egypt_saudi_uae
  pattern: (?i)egypt,\s*saudi\s*arabia,?\s*(?:or|and)\s*(?:the\s+)?u\.?a\.?e\.?
  sets:
    work_mode: onsite
    location_region: multi_country:EG,SA,AE
  description: '''Egypt, Saudi Arabia, or UAE'' -> onsite, multi-country (worked example 3).'
- id: remote_region_restricted_us_canada_only
  pattern: (?i)\b(?:us|u\.s\.|usa|united\s+states)\s*(?:/|and|&|\+)\s*(?:canada|ca)\s+only\b
  sets:
    work_mode: remote
    remote_scope: region_restricted
    remote_scope_regions:
    - US
    - CA
  description: Named region-restricted remote phrase -> remote, region-restricted ['US', 'CA'].
- id: remote_region_restricted_emea_only
  pattern: (?i)\bemea\s+only\b
  sets:
    work_mode: remote
    remote_scope: region_restricted
    remote_scope_regions:
    - EMEA
  description: Named region-restricted remote phrase -> remote, region-restricted ['EMEA'].
- id: remote_region_restricted_latam_only
  pattern: (?i)\blatam\s+only\b
  sets:
    work_mode: remote
    remote_scope: region_restricted
    remote_scope_regions:
    - LATAM
  description: Named region-restricted remote phrase -> remote, region-restricted ['LATAM'].
- id: remote_region_restricted_apac_only
  pattern: (?i)\bapac\s+only\b
  sets:
    work_mode: remote
    remote_scope: region_restricted
    remote_scope_regions:
    - APAC
  description: Named region-restricted remote phrase -> remote, region-restricted ['APAC'].
- id: remote_region_restricted_eu_only
  pattern: (?i)\b(?:eu|european\s+union)\s+only\b
  sets:
    work_mode: remote
    remote_scope: region_restricted
    remote_scope_regions:
    - EU
  description: Named region-restricted remote phrase -> remote, region-restricted ['EU'].
- id: remote_region_restricted_uk_only
  pattern: (?i)\b(?:uk|u\.k\.|united\s+kingdom)\s+only\b
  sets:
    work_mode: remote
    remote_scope: region_restricted
    remote_scope_regions:
    - GB
  description: Named region-restricted remote phrase -> remote, region-restricted ['GB'].
- id: remote_region_restricted_europe_only
  pattern: (?i)\beurope\s+only\b
