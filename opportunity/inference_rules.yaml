version: 1
description: BRIEF-FR-006 A1 committed, ordered, tested text-inference rule table. Applied only to fields
  an adapter did not already map from a native field (opportunity/normalization.py::apply_inference_rules).
  Rules are evaluated top-to-bottom; the first rule that sets a given field wins for that field, so more
  specific composite rules are listed before generic catch-alls. A new rule can be added here without
  editing Python.
rules:
- id: desc_employer_hybrid_workplace_policy
  pattern: (?i)\bwe\s+operate\s+as\s+a\s+hybrid\s+workplace\b
  sets:
    work_mode: hybrid
  channel: description
  description: Explicit employer-wide workplace policy on the posting -> hybrid
- id: desc_required_office_days_hybrid
  pattern: (?i)\b(?:required|requirement)\s+to\s+(?:be|work)\s+(?:in|from)\s+(?:the\s+)?[^.<]{0,80}?office\b[^.<]{0,80}?\b(?:one|two|three|four|1|2|3|4)\s*(?:\([^)]*\)\s*)?days?\s+(?:a|per)\s+week\b
  sets:
    work_mode: hybrid
  channel: description
  description: Explicit one-to-four-day office requirement -> hybrid
- id: desc_required_office_full_week_onsite
  pattern: (?i)\b(?:required|requirement)\s+to\s+(?:be|work)\s+(?:in|from)\s+(?:the\s+)?[^.<]{0,80}?office\b[^.<]{0,80}?\b(?:five|5)\s*(?:\([^)]*\)\s*)?days?\s+(?:a|per)\s+week\b
  sets:
    work_mode: onsite
  channel: description
  description: Explicit five-day office requirement -> onsite
- id: desc_ability_work_from_named_office
  pattern: (?i)\bability\s+to\s+work\s+(?:from|in|at)\s+(?:the\s+|our\s+)?[a-z .,'’‘-]+\s+office\b
  sets:
    work_mode: onsite
  channel: description
  description: Explicit candidate requirement to work from the named office -> onsite
- id: desc_role_fully_remote
  pattern: (?i)\b(?:this\s+(?:role|position|job)\s+is\s+(?:fully\s+)?remote|(?:100%|fully)\s+remote\s+(?:role|position|job)|position\s+is\s+(?:fully\s+)?remote|role\s+is\s+(?:fully\s+)?remote|remote\s+(?:role|position))\b
  sets:
    work_mode: remote
  channel: description
  description: Explicit role/position remote phrasing in description -> remote
- id: desc_work_from_anywhere
  pattern: (?i)\b(?:(?:work|working|worked)\s+from\s+anywhere|can\s+(?:be\s+)?worked\s+from\s+anywhere|work\s+remotely\s+from\s+anywhere)\b
  sets:
    work_mode: remote
    remote_scope: worldwide
  channel: description
  description: Explicit work from anywhere phrasing in description -> remote, worldwide
- id: desc_role_hybrid
  pattern: (?i)\b(?:this\s+(?:role|position|job)\s+is\s+hybrid|hybrid\s+(?:role|position|job|work\s+schedule))\b
  sets:
    work_mode: hybrid
  channel: description
  description: Explicit role/position hybrid phrasing in description -> hybrid
- id: desc_role_onsite
  pattern: (?i)\b(?:this\s+(?:role|position|job)\s+is\s+(?:on[-\s]?site|in[-\s]?office)|(?:on[-\s]?site|in[-\s]?office)\s+(?:role|position|job))\b
  sets:
    work_mode: onsite
  channel: description
  description: Explicit role/position onsite phrasing in description -> onsite
- id: desc_hybrid_in_office_days
  pattern: (?i)\b(?:work|working)\s+in[- ]office\b[^.<]{0,100}\b\d+\s+days?\s*(?:/|per)\s*week\b
  sets:
    work_mode: hybrid
  channel: description
  description: Explicit multi-day in-office schedule -> hybrid
- id: desc_role_hybrid_office_days
  pattern: (?i)\bthis\s+(?:is\s+a\s+full[-\s]?time\s+)?(?:role|position)\b[^.<]{0,180}\bin\s+office\s+\d+\s+days?\s*(?:/|per)\s*week\b
  sets:
    work_mode: hybrid
  channel: description
  description: Explicit role-level multi-day in-office schedule -> hybrid
- id: desc_role_hybrid_work_arrangement
  pattern: (?i)\bthis\s+(?:is\s+a\s+full[-\s]?time\s+)?(?:role|position)\b[^.<]{0,220}\bhybrid(?:\s+(?:working|environment|work\s+model|\([^)]+\)\s+work\s+schedule))?\b
  sets:
    work_mode: hybrid
  channel: description
  description: Explicit role-level hybrid work arrangement in description -> hybrid
- id: desc_role_hybrid_model
  pattern: (?i)\bthis\s+role\b[^<]{0,260}\bhybrid\s+work\s+model\b
  sets:
    work_mode: hybrid
  channel: description
  description: Explicit role-level hybrid work model in description -> hybrid
- id: desc_hybrid_remote_schedule
  pattern: (?i)\bhybrid\s*:\s*\d+%\s+remote\s+work\s+permitted\b
  sets:
    work_mode: hybrid
  channel: description
  description: Explicit hybrid schedule with permitted remote work -> hybrid
- id: desc_role_remote_work_arrangement
  pattern: (?i)\bthis\s+(?:is\s+a\s+full[-\s]?time\s+)?(?:role|position)\b[^.<]{0,220}\bremote(?:ly)?\b
  sets:
    work_mode: remote
  channel: description
  description: Explicit role-level remote arrangement in description -> remote
- id: desc_hybrid_role_in_location
  pattern: (?i)\bhybrid\s+(?:role|position|job)?\s*in\s+([a-zA-Z .,&/'’‘-]+?)(?=[.;,\n]|\s+(?:and\s+report|reporting|or|who|with|to)\b|$)
  sets:
    work_mode: hybrid
  location_from_group: 1
  channel: description
  description: 'Hybrid role in <loc> -> hybrid, location resolved from <loc>'
- id: desc_onsite_role_in_location
  pattern: (?i)\b(?:this\s+(?:role|position|job)\s+is\s+)?(?:on[-\s]?site|in[-\s]?office)\s*(?:role|position|job)?\s*(?:in|at)\s+([a-zA-Z .,&/'’‘-]+?)(?=[.;,\n]|\s+(?:and\s+report|reporting|or|who|with|to)\b|$)
  sets:
    work_mode: onsite
  location_from_group: 1
  channel: description
  description: 'Onsite in <loc> -> onsite, location resolved from <loc>'
- id: desc_role_location_colon
  pattern: (?i)\b(?:role|job|position)\s+location\s*:\s*([a-zA-Z .,&/'’‘-]+?)(?=[.;,\n]|\s+(?:and\s+report|reporting|or|who|with|to)\b|$)
  location_from_group: 1
  channel: description
  description: 'Role location: <loc> -> location resolved from <loc>'
- id: desc_role_located_in
  pattern: (?i)\b(?:position|role|job)\s+located\s+in\s+([a-zA-Z .,&/'’‘-]+?)(?=[.;,\n]|\s+(?:and\s+report|reporting|or|who|with|to)\b|$)
  location_from_group: 1
  channel: description
  description: 'Position located in <loc> -> location resolved from <loc>'
- id: desc_candidate_must_be_based_in
  pattern: (?i)\b(?:candidate\s+must\s+reside\s+in|must\s+reside\s+in|must\s+be\s+based\s+in|candidate\s+must\s+be\s+based\s+in|this\s+(?:role|position|job)\s+is\s+based\s+in)\s+([a-zA-Z .,&/'’‘-]+?)(?=[.;,\n]|\s+(?:and\s+report|reporting|or|who|with|to)\b|$)
  location_from_group: 1
  channel: description
- id: desc_remote_worldwide_bracket
  pattern: (?i)\bremote\s*(?:\(\s*|\s*[-–—:/|]\s*)(?:worldwide|anywhere|global)\s*\)?
  sets:
    work_mode: remote
    remote_scope: worldwide
  channel: both
  description: 'Explicit Remote (Worldwide) / Remote - Worldwide phrasing -> remote, worldwide'
- id: desc_remote_role_region_restricted
  pattern: (?i)\b(?:this\s+(?:is\s+a\s+)?remote\s+(?:role|position|job)|remote\s+(?:role|position|job)|(?:100%|fully\s+)?remote\s+(?:role|position|job)?)\b[^.\n;]{0,60}?\b((?:us|u\.s\.|usa|united\s+states|ca|canada|emea|latam|apac|eu|european\s+union|europe|uk|u\.k\.|united\s+kingdom)(?:\s*(?:/|and|&|\+)\s*(?:us|u\.s\.|usa|united\s+states|ca|canada|emea|latam|apac|eu|european\s+union|europe|uk|u\.k\.|united\s+kingdom))*)\s+only\b
  sets:
    work_mode: remote
    remote_scope: region_restricted
  region_from_group: 1
  channel: description
  description: Explicit remote role restricted to region in description -> remote, region_restricted
- id: remote_region_restricted_us_only
  pattern: (?i)remote\s*\(\s*(?:us|u\.s\.|usa|united\s+states)\s+only\s*\)
  sets:
    work_mode: remote
    remote_scope: region_restricted
    remote_scope_regions:
    - US
  channel: both
  description: '''Remote (US only)'' -> remote, region-restricted [US] (worked example 1, verbatim).'
- id: remote_region_restricted_bracket_country_only
  pattern: (?i)remote\s*\(\s*([a-z .,&/]+?)\s+only\s*\)
  sets:
    work_mode: remote
    remote_scope: region_restricted
  region_from_group: 1
  channel: both
  description: 'Generalisation of worked example 1: ''Remote (<country/region list> only)'' -> remote,
    region-restricted [<codes>]. The captured group is resolved token-by-token against the same country/region
    alias tables the static country_*/region rules below use (opportunity/normalization.py::_COUNTRY_ALIASES
    / _REGION_ALIASES).'
- id: hybrid_city_em_dash
  pattern: (?i)hybrid\s*[—–-]\s*cairo
  sets:
    work_mode: hybrid
    location_country: EG
    location_city: Cairo
  channel: both
  description: '''Hybrid — Cairo'' -> hybrid, EG/Cairo (worked example 2).'
- id: onsite_multi_country_egypt_saudi_uae
  pattern: (?i)egypt,\s*saudi\s*arabia,?\s*(?:or|and)\s*(?:the\s+)?u\.?a\.?e\.?
  sets:
    work_mode: onsite
    location_region: multi_country:EG,SA,AE
  description: '''Egypt, Saudi Arabia, or UAE'' -> onsite, multi-country (worked example 3).'
- id: remote_region_restricted_us_canada_only
  pattern: (?i)\b(?:us|u\.s\.|usa|united\s+states)\s*(?:/|and|&|\+)\s*(?:canada|ca)\s+only\b
  sets:
    work_mode: remote
    remote_scope: region_restricted
    remote_scope_regions:
    - US
    - CA
  description: Named region-restricted remote phrase -> remote, region-restricted ['US', 'CA'].
- id: remote_region_restricted_emea_only
  pattern: (?i)\bemea\s+only\b
  sets:
    work_mode: remote
    remote_scope: region_restricted
    remote_scope_regions:
    - EMEA
  description: Named region-restricted remote phrase -> remote, region-restricted ['EMEA'].
- id: remote_region_restricted_latam_only
  pattern: (?i)\blatam\s+only\b
  sets:
    work_mode: remote
    remote_scope: region_restricted
    remote_scope_regions:
    - LATAM
  description: Named region-restricted remote phrase -> remote, region-restricted ['LATAM'].
- id: remote_region_restricted_apac_only
  pattern: (?i)\bapac\s+only\b
