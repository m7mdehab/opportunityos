name: FR-007 Overseer Hosted Launch

on:
  push:
    branches:
      - work/fr007-overseer-integration
    paths:
      - .github/workflows/fr007-overseer-hosted-launch.yml
      - .github/workflows/fr007-hosted-bootstrap.yml
      - .github/workflows/fr007-cloudflare-staging-deploy.yml
      - pyproject.toml

permissions:
  contents: read

jobs:
  bootstrap:
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/fr007-overseer-integration
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install repository
        run: python -m pip install -e .
      - name: Bootstrap schedules, enqueue due work, and drain bounded jobs
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
          OPPORTUNITYOS_ENVIRONMENT: cloud
          OPPORTUNITYOS_TRUTH_PACK_PATH: founder/truth_pack.yaml.gz.b64
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/fr007_hosted_bootstrap.py --mode all --max-jobs 10 --time-budget-seconds 300

  deploy:
    needs: bootstrap
    uses: ./.github/workflows/fr007-cloudflare-staging-deploy.yml
    with:
      mode: DEPLOY_STAGING
      acknowledge_staging_deployment: true
      ref: work/fr007-overseer-integration
    secrets: inherit

  smoke:
    needs: deploy
    uses: ./.github/workflows/fr007-cloudflare-staging-deploy.yml
    with:
      mode: SMOKE_STAGING
      ref: work/fr007-overseer-integration
    secrets: inherit
