name: Mandatory Governance & Test Suite

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Truth Test Suite
        run: python -m unittest discover truth -v
      - name: Run Recon Regression Suite
        run: python -m unittest discover recon -v
      - name: Run Opportunity Ingestion Test Suite
        run: python -m unittest discover -s opportunity -p "test_*.py" -v
      - name: Run Inbox / Operational Autonomy Test Suite
        run: python -m unittest discover -s inbox -p "test_*.py" -v
      - name: Run Sync Mirror Unit Tests
        run: python scripts/test_sync_mirror.py -v
      - name: Run State Generator Unit Tests
        run: python scripts/test_generate_state.py -v
      - name: Check Guard Boundary & PII
        run: python scripts/check_guard.py --allow-missing-patterns
      - name: Check Repository Integrity
        run: python scripts/check_repository.py
