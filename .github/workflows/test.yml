name: Mandatory Governance & Test Suite

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opportunityos
          POSTGRES_PASSWORD: testpassword123
          POSTGRES_DB: opportunityos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Run Database Migrations
        env:
          OPPORTUNITYOS_DB_URL: "postgresql+psycopg2://opportunityos:testpassword123@localhost:5432/opportunityos_test"
        run: alembic upgrade head
      - name: Run Full Subsystem Test Suite
        env:
          OPPORTUNITYOS_DB_URL: "postgresql+psycopg2://opportunityos:testpassword123@localhost:5432/opportunityos_test"
        run: python -m unittest discover -v
      - name: Check Guard Boundary & PII
        run: python scripts/check_guard.py --allow-missing-patterns
      - name: Check Repository Integrity
        run: python scripts/check_repository.py
