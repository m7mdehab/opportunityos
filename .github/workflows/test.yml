name: Mandatory Governance & Test Suite

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Check Guard Boundary & PII
        run: python scripts/check_guard.py --allow-missing-patterns
      - name: Check Repository Integrity
        run: python scripts/check_repository.py

  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opportunityos
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: opportunityos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # OPPORTUNITYOS_DB_URL is the application/test DSN. The per-run GitHub
      # run id is an ephemeral CI-only database password, so password auth is
      # preserved without committing a reusable credential. PGPASSWORD is also
      # supplied because scripts/dev_env.py intentionally emits passwordless
      # localhost DSNs for its local test-database helpers; libpq consumes it.
      OPPORTUNITYOS_DB_URL: postgresql+psycopg2://opportunityos:${{ github.run_id }}@localhost:5432/opportunityos_test
      PGPASSWORD: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Database Migrations
        run: alembic upgrade head
      - name: Run Full Subsystem Test Suite
        run: python -m unittest discover -v

  web:
    name: web-build-lint-playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Web Dependencies
        working-directory: web
        run: npm ci
      - name: Build Web
        working-directory: web
        run: npm run build
      - name: Lint Web
        working-directory: web
        run: npm run lint
      - name: Install Playwright Browsers
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run Playwright Smoke
        working-directory: web
        run: npx playwright test
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
