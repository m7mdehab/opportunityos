name: Mandatory Governance & Test Suite

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Check Guard Boundary & PII
        run: python scripts/check_guard.py --allow-missing-patterns
      - name: Check Repository Integrity
        run: python scripts/check_repository.py

  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opportunityos
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: opportunityos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # OPPORTUNITYOS_DB_URL is the application/test DSN. The per-run GitHub
      # run id is an ephemeral CI-only database password, so password auth is
      # preserved without committing a reusable credential. PGPASSWORD is also
      # supplied because scripts/dev_env.py intentionally emits passwordless
      # localhost DSNs for its local test-database helpers; libpq consumes it.
      OPPORTUNITYOS_DB_URL: postgresql+psycopg2://opportunityos:${{ github.run_id }}@localhost:5432/opportunityos_test
      PGPASSWORD: ${{ github.run_id }}
      # A-1 freezes the real-PostgreSQL full-suite contract at zero skipped
      # tests. The 20k-row A-15 timing test is a required acceptance gate, not
      # an optional smoke test, so CI deliberately enables it rather than
      # reporting a green suite with one gated skip.
      OPPORTUNITYOS_RUN_SEARCH_PERF: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Database Migrations
        run: alembic upgrade head
      - name: Run Full Subsystem Test Suite
        run: python -m unittest discover -v 2>&1 | tee full-test.log
      - name: Upload backend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr007-backend-test-log-${{ github.run_id }}
          path: full-test.log
          if-no-files-found: error
          retention-days: 7

  web:
    name: web-build-lint-playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Web Dependencies
        working-directory: web
        run: npm ci
      - name: Build Web
        working-directory: web
        run: npm run build
      - name: Lint Web
        working-directory: web
        run: npm run lint
      - name: Install Playwright Browsers
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run Playwright Smoke
        working-directory: web
        run: npx playwright test
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  bc-production-canary:
    name: bc-production-canary
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'work/bc-final-geo-capacity' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    needs: [governance, backend, web]
    environment: fr007-staging
    runs-on: ubuntu-latest
    env:
      OPPORTUNITYOS_DB_URL: ${{ secrets.CLOUD_DATABASE_URL || secrets.OPOS_TARGET_DB_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Recheck focused replay and projection gates
        run: >-
          python -m unittest
          tests.test_bc_candidate_canary
          tests.test_bc_production_replay
          storage.test_feed_projection_service
      - name: Execute bounded BC production candidate canary
        run: python -m scripts.bc_candidate_canary --execute


  ops-capacity-maintenance:
    name: ops-capacity-maintenance
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'ops/run-worker-validation-now'
    needs: [governance]
    environment: fr007-staging
    runs-on: ubuntu-latest
    env:
      OPOS_TARGET_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install repository
        run: python -m pip install -e .
      - name: Reclaim only provider-safe physical bloat
        run: |
          python - <<'PY'
          import json
          import os
          from sqlalchemy import create_engine, text
          from scripts.db_capacity_maintenance import relation_rewrite_peak_estimate
          from scripts.db_capacity_guard import PROVIDER_LIMIT_BYTES

          relations = (
              "public.feed_projection",
              "public.opportunity_cold_archive",
              "storage.objects",
              "public.founder_cv_selections",
              "public.worker_jobs",
              "public.source_poll_runs",
              "public.source_schedules",
              "public.founder_triage_states",
              "public.field_provenances",
              "public.match_evaluations",
          )
          engine = create_engine(os.environ["OPOS_TARGET_DB_URL"], pool_pre_ping=True)
          try:
              with engine.connect().execution_options(isolation_level="AUTOCOMMIT") as connection:
                  before = int(connection.execute(text("SELECT pg_database_size(current_database())")).scalar_one())
                  results = []
                  for relation in relations:
                      database_bytes = int(connection.execute(text("SELECT pg_database_size(current_database())")).scalar_one())
                      relation_bytes = int(connection.execute(
                          text("SELECT pg_total_relation_size(CAST(:relation AS regclass))"),
                          {"relation": relation},
                      ).scalar_one())
                      peak = relation_rewrite_peak_estimate(database_bytes, relation_bytes)
                      if peak >= PROVIDER_LIMIT_BYTES:
                          results.append({
                              "relation": relation,
                              "status": "skipped_provider_headroom",
                              "database_bytes": database_bytes,
                              "relation_bytes": relation_bytes,
                              "estimated_peak_bytes": peak,
                          })
                          continue
                      connection.execute(text(f"VACUUM (FULL, ANALYZE) {relation}"))
                      after_relation = int(connection.execute(
                          text("SELECT pg_total_relation_size(CAST(:relation AS regclass))"),
                          {"relation": relation},
                      ).scalar_one())
                      after_db = int(connection.execute(text("SELECT pg_database_size(current_database())")).scalar_one())
                      results.append({
                          "relation": relation,
                          "status": "reclaimed",
                          "before_relation_bytes": relation_bytes,
                          "after_relation_bytes": after_relation,
                          "database_bytes": after_db,
                      })
                  after = int(connection.execute(text("SELECT pg_database_size(current_database())")).scalar_one())
                  print(json.dumps({
                      "database_bytes_before": before,
                      "database_bytes_after": after,
                      "database_reclaimed_bytes": max(0, before-after),
                      "relations": results,
                  }, sort_keys=True))
          finally:
              engine.dispose()
          PY

  ops-controlled-catchup:
    name: ops-controlled-catchup
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'ops/run-worker-validation-now'
    needs: [ops-capacity-maintenance]
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPOS_TARGET_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
      SUPABASE_STORAGE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL || 'https://sunjfepvdzfknglrjwhm.supabase.co' }}
      STORAGE_SERVICE_KEY: ${{ secrets.STORAGE_SERVICE_KEY }}
      OPPORTUNITYOS_ENVIRONMENT: cloud
      OPPORTUNITYOS_TRUTH_PACK_PATH: founder/truth_pack.yaml.gz.b64
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install repository
        run: python -m pip install -e .
      - name: Freeze due-source manifest
        run: python scripts/fr007_due_source_catchup.py --freeze --state-file /tmp/catchup-state.json
      - name: Run first controlled 50-source cohort
        run: python scripts/fr007_due_source_catchup.py --cohort-index 0 --state-file /tmp/catchup-state.json
      - name: Print sanitized checkpoint
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/catchup-state.json")
          if p.exists():
              s=json.loads(p.read_text())
              print(json.dumps({
                  "status": s.get("status"),
                  "manifest_count": s.get("manifest",{}).get("count"),
                  "result_count": len(s.get("results",{})),
                  "cohort_count": len(s.get("cohorts",[])),
                  "maintenance_reason": s.get("maintenance_reason"),
                  "database_bytes": (s.get("last_snapshot") or {}).get("database_bytes"),
              }, sort_keys=True))
          PY
