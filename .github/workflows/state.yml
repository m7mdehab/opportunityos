name: State

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  state:
    # Repository-generation/integrity checks need Git + Python + PyYAML.
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install state generator dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir PyYAML
      - name: Verify generated state freshness
        env:
          STATE_PRESERVE_TIMESTAMP: "1"
        run: |
          python scripts/generate_state.py
          if ! git diff --exit-code -- docs/STATE.md; then
            echo "RULE STATE_FRESHNESS FAILED: docs/STATE.md differs from repository facts. REMEDY: run 'python scripts/generate_state.py' and commit docs/STATE.md."
            exit 1
          fi
      - name: Verify report, brief, and ADR integrity
        run: python scripts/check_repository.py
