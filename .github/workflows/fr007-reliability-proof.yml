name: FR-007 Reliability Proof Harness

on:
  push:
    branches:
      - work/fr007-overseer-integration
      - main
    paths:
      - 'scripts/fr007_reliability_proof.py'
      - '.github/workflows/fr007-reliability-proof.yml'
  pull_request:
    paths:
      - 'scripts/fr007_reliability_proof.py'
      - 'scripts/test_fr007_reliability_proof.py'
      - 'worker/**'
      - 'opportunity/**'
      - 'storage/**'
      - '.github/workflows/fr007-reliability-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opportunityos
          POSTGRES_PASSWORD: reliability-proof
          POSTGRES_DB: opportunityos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opportunityos -d opportunityos"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      OPPORTUNITYOS_DB_URL: postgresql+psycopg2://opportunityos:reliability-proof@localhost:5432/opportunityos
      FR007_RELIABILITY_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply repository migrations
        run: python -m alembic upgrade head
      - name: Run reliability proof tests
        run: python -m unittest scripts.test_fr007_reliability_proof -v
      - name: Run worker regression suites
        run: python -m unittest worker.test_runner worker.test_scheduler worker.test_postgres_queue_durability -v
      - name: Run opportunity and storage regression suites
        run: python -m unittest opportunity.test_persistence storage.test_feed_query storage.test_feed_projection_service -v
      - name: Run API read and auth regression suites
        run: python -m unittest api.test_api.AuthFailClosedTest api.test_api.AuthSessionTest api.test_api.OpportunityRoutesTest -v
      - name: Compile and repository checks
        run: |
          python -m py_compile scripts/fr007_reliability_proof.py scripts/test_fr007_reliability_proof.py
          python scripts/check_repository.py
          python scripts/check_guard.py --allow-missing-patterns

  hosted-staging:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPOS_STAGING_WEB_URL: ${{ vars.OPOS_STAGING_WEB_URL || 'https://opportunityos.m7mdehab.com' }}
      CLOUD_DATABASE_URL: ${{ secrets.CLOUD_DATABASE_URL || secrets.OPOS_TARGET_DB_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install hosted proof dependencies
        run: python -m pip install -e '.[dev]'
      - name: Execute live hosted reliability proof
        run: |
          set -euo pipefail
          test -n "${OPOS_STAGING_WEB_URL}" || { echo "::error::OPOS_STAGING_WEB_URL is missing"; exit 1; }
          test -n "${CLOUD_DATABASE_URL}" || { echo "::error::CLOUD_DATABASE_URL/OPOS_TARGET_DB_URL is missing"; exit 1; }
          mkdir -p hosted-reliability
          python scripts/fr007_reliability_proof.py \
            --hosted \
            --target-url "${OPOS_STAGING_WEB_URL}" \
            --dsn-env CLOUD_DATABASE_URL \
            --deployment-id "staging-cloudflare-supabase-github" \
            --sha "${GITHUB_SHA}" \
            --output hosted-reliability/report.json
      - name: Upload sanitized hosted proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr007-hosted-reliability-${{ github.run_id }}
          path: hosted-reliability/report.json
          if-no-files-found: error
          retention-days: 30

