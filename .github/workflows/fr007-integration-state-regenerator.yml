name: FR-007 Integration State Regenerator

on:
  push:
    branches:
      - work/fr007-overseer-integration
    paths-ignore:
      - docs/STATE.md

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/fr007-overseer-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-cache-dir PyYAML
      - name: Generate canonical state
        env:
          STATE_PRESERVE_TIMESTAMP: "1"
        run: python scripts/generate_state.py
      - name: Commit generated state if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/STATE.md; then
            echo "STATE already fresh"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/STATE.md
          git commit -m "state: regenerate FR-007 integration state"
          git push origin HEAD:work/fr007-overseer-integration
