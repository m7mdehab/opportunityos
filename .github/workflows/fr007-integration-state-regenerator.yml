name: FR-007 Integration State Regenerator

on:
  # Manual only. Automatic bot-authored commits suppress downstream PR Actions
  # on the resulting head; the Overseer regenerates STATE as the final
  # human/tool-authored commit before merge.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/fr007-overseer-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-cache-dir -e .
      - name: Generate provider execution bundle
        run: python scripts/fr007_supabase_execution_bundle.py generate
      - name: Generate canonical state
        env:
          STATE_PRESERVE_TIMESTAMP: "1"
        run: python scripts/generate_state.py
      - name: Commit generated artifacts if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/STATE.md reports/evidence/FR-007/provider-execution; then
            echo "Generated state and provider bundle already fresh"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/STATE.md reports/evidence/FR-007/provider-execution
          git commit -m "state: regenerate FR-007 integration artifacts"
          git push origin HEAD:work/fr007-overseer-integration
