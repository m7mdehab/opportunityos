name: FR-007 final runtime closure

on:
  workflow_dispatch:
    inputs:
      truth_pack_hash:
        description: "Authoritative truth-pack hash (leave blank to discover it)"
        required: false
        default: ""
      mode:
        description: "Closure mode: full, recovery, or acceptance"
        required: false
        type: string
        default: "full"
      acceptance_required:
        description: "Require protected runtime acceptance after bounded recovery"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      truth_pack_hash:
        description: "Authoritative truth-pack hash (leave blank to discover it)"
        required: false
        type: string
        default: ""
      mode:
        description: "Closure mode: full, recovery, or acceptance"
        required: false
        type: string
        default: "full"
      acceptance_required:
        description: "Require protected runtime acceptance after bounded recovery"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: fr007-final-runtime-closure
  cancel-in-progress: false

jobs:
  deterministic-postgres:
    if: ${{ inputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opportunityos
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: opportunityos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      OPPORTUNITYOS_DB_URL: postgresql+psycopg2://opportunityos:${{ github.run_id }}@localhost:5432/opportunityos_test
      OPOS_TARGET_DB_URL: postgresql+psycopg2://opportunityos:${{ github.run_id }}@localhost:5432/opportunityos_test
      PGPASSWORD: ${{ github.run_id }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev]"
      - name: Fresh migration and one-head proof
        run: |
          alembic upgrade head
          test "$(alembic heads | grep -c ' (head)')" = 1
      - name: Production migration-state upgrade proof
        run: |
          alembic downgrade 0019_activity_view_access
          test "$(alembic current | grep -c '0019_activity_view_access')" = 1
          alembic upgrade head
          test "$(alembic current | grep -c '0025_current_feed_fast_path')" = 1
      - name: Capacity/archive PostgreSQL proof
        run: |
          python -m unittest \
            storage.test_cold_archive \
            storage.test_storage_v2 \
            scripts.test_db_capacity_guard \
            scripts.test_db_capacity_maintenance \
            storage.test_hosted_runtime_migration \
            worker.test_postgres_queue_durability \
            -v
      - name: Runtime/storage/matching regressions
        run: |
          python -m unittest opportunity.test_persistence matching.test_evaluate_persist worker.test_worker worker.test_runner storage.test_feed_projection_service storage.test_feed_query -q
      - run: python scripts/check_repository.py
      - run: python scripts/check_guard.py --allow-missing-patterns

  live-preflight:
    needs: deterministic-postgres
    if: ${{ always() && (inputs.mode == 'full' || inputs.mode == 'recovery' || inputs.mode == 'acceptance' || inputs.acceptance_required) && (inputs.mode == 'recovery' || inputs.mode == 'acceptance' || inputs.acceptance_required || needs.deterministic-postgres.result == 'success') }}
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - name: Sanitized live read-only preflight
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.CLOUD_DATABASE_URL || secrets.OPOS_TARGET_DB_URL }}
          OPOS_DIRECT_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
          SUPABASE_STORAGE_URL: ${{ secrets.SUPABASE_URL || 'https://sunjfepvdzfknglrjwhm.supabase.co' }}
          STORAGE_SERVICE_KEY: ${{ secrets.STORAGE_SERVICE_KEY }}
          STORAGE_PRIVATE_BUCKET: ${{ secrets.STORAGE_PRIVATE_BUCKET || 'opportunity-artifacts' }}
        run: |
          echo "CLOSURE_MODE=${{ inputs.mode }}"
          set -o pipefail
          python scripts/fr007_capacity_closure.py preflight --truth-pack-hash "${{ inputs.truth_pack_hash }}" | tee w227-preflight.json
      - uses: actions/upload-artifact@v4
        with:
          name: fr007-w227-preflight-${{ github.run_id }}
          path: w227-preflight.json

  maintenance:
    needs: live-preflight
    if: ${{ inputs.mode == 'full' }}
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - name: Same-session migration, compaction and physical reclaim
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.CLOUD_DATABASE_URL || secrets.OPOS_TARGET_DB_URL }}
          OPOS_DIRECT_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
          SUPABASE_STORAGE_URL: ${{ secrets.SUPABASE_URL || 'https://sunjfepvdzfknglrjwhm.supabase.co' }}
          STORAGE_SERVICE_KEY: ${{ secrets.STORAGE_SERVICE_KEY }}
          STORAGE_PRIVATE_BUCKET: ${{ secrets.STORAGE_PRIVATE_BUCKET || 'opportunity-artifacts' }}
        run: |
          set -o pipefail
          python scripts/fr007_capacity_closure.py live-maintenance --truth-pack-hash "${{ inputs.truth_pack_hash }}" | tee w227-maintenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: fr007-w227-maintenance-${{ github.run_id }}
          path: w227-maintenance.json

  fresh-write:
    needs: maintenance
    if: ${{ inputs.mode == 'full' }}
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - name: Fresh normal application connection write proof
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.CLOUD_DATABASE_URL || secrets.OPOS_TARGET_DB_URL }}
          OPOS_DIRECT_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
          SUPABASE_STORAGE_URL: ${{ secrets.SUPABASE_URL || 'https://sunjfepvdzfknglrjwhm.supabase.co' }}
          STORAGE_SERVICE_KEY: ${{ secrets.STORAGE_SERVICE_KEY }}
          STORAGE_PRIVATE_BUCKET: ${{ secrets.STORAGE_PRIVATE_BUCKET || 'opportunity-artifacts' }}
        run: |
          set -o pipefail
          python scripts/fr007_capacity_closure.py fresh-write | tee w227-fresh-write.json

  bounded-recovery:
    needs: [live-preflight, maintenance, fresh-write]
    if: ${{ always() && (inputs.mode == 'full' || inputs.mode == 'recovery' || inputs.mode == 'acceptance' || inputs.acceptance_required) && (inputs.mode == 'recovery' || inputs.mode == 'acceptance' || inputs.acceptance_required || needs.maintenance.result == 'success') && (inputs.mode == 'recovery' || inputs.mode == 'acceptance' || inputs.acceptance_required || needs.fresh-write.result == 'success') && needs.live-preflight.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: {shard: [1, 2, 3, 4, 5]}
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - name: Natural stale-first bounded recovery
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.CLOUD_DATABASE_URL || secrets.OPOS_TARGET_DB_URL }}
          OPPORTUNITYOS_ENVIRONMENT: cloud
          OPPORTUNITYOS_TRUTH_PACK_PATH: founder/truth_pack.yaml.gz.b64
          OPOS_WORKER_ID: "w227-recovery-${{ github.run_id }}-${{ matrix.shard }}"
        run: >-
          python scripts/fr007_worker_error_delta.py --max-jobs 30
          --time-budget-seconds 480 --worker-id "$OPOS_WORKER_ID"
          --shard "${{ matrix.shard }}"
          --output "w227-error-delta-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fr007-w227-error-delta-${{ github.run_id }}-${{ matrix.shard }}
          path: w227-error-delta-${{ matrix.shard }}.json
          if-no-files-found: ignore

  recovery-snapshot:
    needs: bounded-recovery
    if: ${{ always() && needs.bounded-recovery.result == 'success' && (inputs.mode == 'full' || inputs.mode == 'recovery' || inputs.mode == 'acceptance' || inputs.acceptance_required) }}
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - name: Sanitized queue and capacity snapshot
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.CLOUD_DATABASE_URL || secrets.OPOS_TARGET_DB_URL }}
        run: |
          set -o pipefail
          python scripts/fr007_capacity_closure.py preflight --truth-pack-hash "${{ inputs.truth_pack_hash }}" | tee w227-recovery-${{ github.run_id }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: fr007-w227-recovery-${{ github.run_id }}
          path: w227-recovery-${{ github.run_id }}.json

  connection-observer:
    needs: live-preflight
    if: ${{ always() && (inputs.acceptance_required || inputs.mode == 'acceptance') && needs.live-preflight.result == 'success' }}
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - name: Observe protected five-shard connection pressure
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.CLOUD_DATABASE_URL || secrets.OPOS_TARGET_DB_URL }}
        run: |
          python - <<'PY'
          import os, time
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["OPOS_TARGET_DB_URL"], pool_size=1, max_overflow=0, pool_pre_ping=True, connect_args={"application_name": "opportunityos-fr007-proof"})
          max_worker = max_idle = max_unattributed = failures = 0
          for _ in range(72):
              try:
                  with engine.connect() as conn:
                      row = conn.execute(text("""
                        select count(*)::int total,
                          count(*) filter (where state='idle in transaction' and xact_start is not null and now()-xact_start > interval '30 seconds')::int idle_tx
                        from pg_stat_activity where application_name='opportunityos-fr007-worker'
                      """)).mappings().one()
                      unattributed = conn.execute(text("""select count(*)::int from pg_stat_activity where usename='postgres' and coalesce(application_name,'')='' and client_addr is not null""")).scalar_one()
                      max_worker = max(max_worker, int(row['total']))
                      max_idle = max(max_idle, int(row['idle_tx']))
                      max_unattributed = max(max_unattributed, int(unattributed))
              except Exception as exc:
                  failures += 1
                  print(f"PROBE_FAILURE={type(exc).__name__}")
              time.sleep(5)
          engine.dispose()
          print(f"MAX_WORKER_CONNECTIONS={max_worker}")
          print(f"MAX_IDLE_IN_TRANSACTION={max_idle}")
          print(f"MAX_UNATTRIBUTED_POSTGRES={max_unattributed}")
          print(f"PROBE_FAILURES={failures}")
          import json
          with open("w227-observer.json", "w", encoding="utf-8") as fh:
              json.dump({"max_worker_connections": max_worker, "max_idle_in_transaction": max_idle, "max_unattributed_postgres": max_unattributed, "probe_failures": failures}, fh, sort_keys=True)
          if failures or not (1 <= max_worker <= 10) or max_idle != 0 or max_unattributed != 0:
              raise SystemExit("connection-pressure acceptance failed")
      - uses: actions/upload-artifact@v4
        with:
          name: fr007-w227-observer-${{ github.run_id }}
          path: w227-observer.json

  final-proof:
    needs: [bounded-recovery, connection-observer]
    if: ${{ always() && (inputs.acceptance_required || inputs.mode == 'acceptance') && needs.bounded-recovery.result == 'success' && needs.connection-observer.result == 'success' }}
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - name: Collect exactly five sanitized shard error deltas
        uses: actions/download-artifact@v4
        with:
          pattern: fr007-w227-error-delta-${{ github.run_id }}-*
          path: w227-error-deltas
          merge-multiple: true
      - name: Aggregate PostgreSQL error delta from proof start
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: >-
          python scripts/fr007_worker_error_delta.py
          --aggregate-dir w227-error-deltas
          --output w227-error-delta-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fr007-w227-error-delta-summary-${{ github.run_id }}
          path: w227-error-delta-summary.json
          if-no-files-found: ignore
      - name: Queue/capacity/error acceptance snapshot
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.CLOUD_DATABASE_URL || secrets.OPOS_TARGET_DB_URL }}
        run: |
          python scripts/fr007_capacity_closure.py preflight
          python - <<'PY'
          import os, sys
          from sqlalchemy import create_engine, text
          e=create_engine(os.environ['OPOS_TARGET_DB_URL'], pool_size=1, max_overflow=0)
          with e.connect() as c:
              size=int(c.execute(text("select pg_database_size(current_database())")).scalar_one())
              row=c.execute(text("""select count(*) filter (where status='RUNNING' and lease_expires_at<now()) expired,
                coalesce(extract(epoch from (now()-min(coalesce(run_after,created_at)) filter (where status in ('PENDING','RETRY') and coalesce(run_after,created_at)<=now()))),0)::bigint oldest from worker_jobs""")).mappings().one()
          e.dispose()
          if size > 200*1024*1024 or int(row['expired']) != 0 or int(row['oldest']) >= 900:
              raise SystemExit(f"final queue/capacity acceptance failed: size={size} row={dict(row)}")
          PY

  full-monitor:
    needs: final-proof
    if: ${{ always() && (inputs.acceptance_required || inputs.mode == 'acceptance') && needs.final-proof.result == 'success' }}
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - name: FULL monitor and normal incident resolution
        env:
          CLOUD_DATABASE_URL: ${{ secrets.CLOUD_DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: https://sunjfepvdzfknglrjwhm.supabase.co
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/fr007_cloud_monitor.py --mode FULL --db-url "$CLOUD_DATABASE_URL" --supabase-url "$NEXT_PUBLIC_SUPABASE_URL" --output-report w227-monitor.json --output-incident w227-incident.json
          python scripts/process_incident_alert.py --incident-file w227-incident.json
      - uses: actions/upload-artifact@v4
        with:
          name: fr007-w227-monitor-${{ github.run_id }}
          path: w227-*.json
