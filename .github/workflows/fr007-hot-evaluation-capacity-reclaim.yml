name: FR-007 Hot Evaluation Capacity Reclaim

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Run full recovery/drains or reclaim capacity without starting workers
        type: choice
        options: [full, maintenance-only]
        default: full
        required: true
  push:
    branches: [main]
    paths:
      - matching/evaluate_persist.py
      - api/serialization.py
      - scripts/db_capacity_maintenance.py
      - scripts/test_db_capacity_hot_postgres.py

permissions:
  contents: read

concurrency:
  # Serialize the maintenance and its recovery drain against the normal
  # scheduled worker workflow so no worker can write while VACUUM FULL holds
  # exclusive relation locks.
  group: fr007-worker-drain
  cancel-in-progress: false

jobs:
  maintain:
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      heavy_work_allowed: ${{ steps.verify.outputs.heavy_work_allowed }}
      capacity_baseline_at: ${{ steps.plan.outputs.capacity_baseline_at }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install repository dependencies
        run: python -m pip install -e .
      - name: Dry-run HOT evaluation compaction
        id: plan
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
        run: |
          python scripts/db_capacity_maintenance.py hot-dimensions-plan
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from scripts.db_capacity_guard import PROVIDER_LIMIT_BYTES
          from scripts.db_capacity_maintenance import relation_rewrite_peak_estimate
          engine = create_engine(os.environ["OPOS_TARGET_DB_URL"], pool_pre_ping=True)
          try:
              with engine.connect() as connection:
                  baseline = connection.execute(text("SELECT now() AT TIME ZONE 'UTC'")).scalar_one()
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                      handle.write(f"capacity_baseline_at={baseline.isoformat()}\n")
          finally:
              engine.dispose()
          PY
      - name: Apply HOT evaluation compaction and physical reclaim
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
        run: python scripts/db_capacity_maintenance.py hot-dimensions-apply --confirm-maintenance
      - name: Reclaim application and Storage metadata bloat without changing rows
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from scripts.db_capacity_guard import PROVIDER_LIMIT_BYTES
          from scripts.db_capacity_maintenance import relation_rewrite_peak_estimate
          engine = create_engine(os.environ["OPOS_TARGET_DB_URL"], pool_pre_ping=True)
          try:
              with engine.connect().execution_options(isolation_level="AUTOCOMMIT") as connection:
                  for relation in (
                      "public.opportunities",
                      "public.field_provenances",
                      "public.opportunity_cold_archive",
                      "public.feed_projection",
                      # Physical reclamation only; never mutate Storage rows here.
                      # Supabase Storage data changes continue to go through its API.
                      "storage.objects",
                  ):
                      database_bytes = int(connection.execute(
                          text("SELECT pg_database_size(current_database())")
                      ).scalar_one())
                      relation_bytes = int(connection.execute(
                          text("SELECT pg_total_relation_size(CAST(:relation AS regclass))"),
                          {"relation": relation},
                      ).scalar_one())
                      estimated_peak = relation_rewrite_peak_estimate(
                          database_bytes, relation_bytes
                      )
                      if estimated_peak >= PROVIDER_LIMIT_BYTES:
                          print(
                              f"deferred_rewrite={relation} database_bytes={database_bytes} "
                              f"relation_bytes={relation_bytes} estimated_peak_bytes={estimated_peak} "
                              f"provider_limit_bytes={PROVIDER_LIMIT_BYTES}"
                          )
                          continue
                      print(
                          f"rewrite_preflight={relation} database_bytes={database_bytes} "
                          f"relation_bytes={relation_bytes} estimated_peak_bytes={estimated_peak}"
                      )
                      connection.execute(text(f"VACUUM (FULL, ANALYZE) {relation}"))
          finally:
              engine.dispose()
          PY
      - name: Verify physical capacity and compact dimension invariant
        id: verify
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from scripts.db_capacity_guard import BLOCK_BYTES
          from scripts.db_capacity_maintenance import hot_dimension_validation_summary
          engine = create_engine(os.environ["OPOS_TARGET_DB_URL"], pool_pre_ping=True)
          try:
              with engine.connect() as connection:
                  size = int(connection.execute(text("SELECT pg_database_size(current_database())")).scalar_one())
                  validation = hot_dimension_validation_summary(connection)
              invalid = validation["invalid_rows"]
              print(
                  f"capacity_after_bytes={size} heavy_work_pause_bytes={BLOCK_BYTES} "
                  f"checked_dimension_rows={validation['checked_rows']} invalid_dimension_rows={invalid}"
              )
              if size >= BLOCK_BYTES:
                  raise SystemExit("capacity remains at/above the 400 MiB heavy-work pause boundary")
              if invalid:
                  raise SystemExit("HOT/PROTECTED dimension envelope still contains unsupported duplicated fields")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write("heavy_work_allowed=true\n")
          finally:
              engine.dispose()
          PY

  recover-orphan-deadletters:
    needs: maintain
    if: ${{ needs.maintain.outputs.heavy_work_allowed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'full') }}
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install repository dependencies
        run: python -m pip install -e .
      - name: Enqueue fresh jobs for only the fixed orphan-race dead letters
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/fr007_recover_orphan_deadletters.py

  drain:
    needs: recover-orphan-deadletters
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install repository dependencies
        run: python -m pip install -e .
      - name: Drain one bounded normal worker shard after capacity recovery
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
          SUPABASE_STORAGE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL || 'https://sunjfepvdzfknglrjwhm.supabase.co' }}
          STORAGE_SERVICE_KEY: ${{ secrets.STORAGE_SERVICE_KEY }}
          OPPORTUNITYOS_ENVIRONMENT: cloud
          OPPORTUNITYOS_TRUTH_PACK_PATH: founder/truth_pack.yaml.gz.b64
          OPOS_WORKER_ID: "capacity-recovery-${{ github.run_id }}-${{ matrix.shard }}"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python scripts/fr007_hosted_bootstrap.py \
            --mode drain \
            --max-jobs 30 \
            --time-budget-seconds 480 \
            --worker-id "${OPOS_WORKER_ID}"

  final-verification:
    needs: [maintain, recover-orphan-deadletters, drain]
    if: ${{ always() && needs.maintain.result == 'success' }}
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install repository dependencies
        run: python -m pip install -e .
      - name: Verify post-operation capacity, queue, and compact envelope
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
          OPERATION: ${{ inputs.operation || 'full' }}
          CAPACITY_BASELINE_AT: ${{ needs.maintain.outputs.capacity_baseline_at }}
          RECOVERY_RESULT: ${{ needs.recover-orphan-deadletters.result }}
          DRAIN_RESULT: ${{ needs.drain.result }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from sqlalchemy import create_engine, text
          from scripts.db_capacity_guard import BLOCK_BYTES, HARD_STOP_BYTES, PROVIDER_LIMIT_BYTES
          from scripts.db_capacity_maintenance import hot_dimension_validation_summary
          engine = create_engine(os.environ["OPOS_TARGET_DB_URL"], pool_pre_ping=True)
          try:
              with engine.connect() as connection:
                  size = int(connection.execute(text(
                      "SELECT pg_database_size(current_database())"
                  )).scalar_one())
                  queue = connection.execute(text("""
                      SELECT status, job_type, count(*)::bigint AS count
                      FROM worker_jobs GROUP BY status, job_type
                      ORDER BY status, job_type
                  """)).mappings().all()
                  leases = connection.execute(text("""
                      SELECT status, job_type, lease_owner, lease_expires_at, updated_at
                      FROM worker_jobs WHERE status = 'RUNNING'
                      ORDER BY job_type, id
                  """)).mappings().all()
                  failure_count = int(connection.execute(text("""
                      SELECT count(*) FROM worker_jobs
                      WHERE error_message LIKE '%W23 physical capacity ceiling%'
                        AND updated_at >= :capacity_baseline_at
                  """), {"capacity_baseline_at": datetime.fromisoformat(
                      os.environ["CAPACITY_BASELINE_AT"]
                  )}).scalar_one())
                  dimension_validation = hot_dimension_validation_summary(connection)
                  lifecycle = connection.execute(text("""
                      SELECT lifecycle_tier, count(*)::bigint AS count
                      FROM opportunities GROUP BY lifecycle_tier ORDER BY lifecycle_tier
                  """)).mappings().all()
                  orphan_count = int(connection.execute(text("""
                      SELECT count(*) FROM worker_jobs
                      WHERE status='DEAD_LETTER'
                        AND error_message LIKE '%Handler raised: Instance ''<OpportunityArchiveOrphanRecord%'
                  """)).scalar_one())
                  dead_letter_count = int(connection.execute(text(
                      "SELECT count(*) FROM worker_jobs WHERE status='DEAD_LETTER'"
                  )).scalar_one())
              invalid = dimension_validation["invalid_rows"]

              snapshot = {
                  "database_bytes": size,
                  "heavy_work_pause_bytes": BLOCK_BYTES,
                  "internal_hard_stop_bytes": HARD_STOP_BYTES,
                  "provider_limit_bytes": PROVIDER_LIMIT_BYTES,
                  "capacity_status": (
                      "HARD_STOP_CAPACITY" if size >= HARD_STOP_BYTES else
                      "HEAVY_WORK_PAUSED" if size >= BLOCK_BYTES else "NORMAL_OR_MONITOR"
                  ),
                  "lifecycle_counts": [dict(row) for row in lifecycle],
                  "worker_counts": [dict(row) for row in queue],
                  "running_jobs": [dict(row) for row in leases],
                  "orphan_race_dead_letters": orphan_count,
                  "unrelated_dead_letters": dead_letter_count - orphan_count,
                  "new_capacity_ceiling_failures_this_run": failure_count,
                  "checked_hot_protected_dimension_rows": dimension_validation["checked_rows"],
                  "unsupported_hot_protected_dimension_rows": invalid,
                  "operation": os.environ["OPERATION"],
              }
              print(json.dumps(snapshot, sort_keys=True, default=str))
              if invalid:
                  raise SystemExit("HOT/PROTECTED dimensions contain unsupported fields")
              if failure_count:
                  raise SystemExit("workers hit the W23 capacity guard after reclaim")
              if os.environ["OPERATION"] == "full" and (
                  os.environ["RECOVERY_RESULT"] != "success"
                  or os.environ["DRAIN_RESULT"] != "success"
              ):
                  raise SystemExit("recovery or bounded worker drain did not complete successfully")
          finally:
              engine.dispose()
          PY
