name: FR-007 orphan dead-letter recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fr007-orphan-deadletter-recovery.yml
      - scripts/fr007_recover_orphan_deadletters.py

permissions:
  contents: read

concurrency:
  group: fr007-orphan-deadletter-recovery
  cancel-in-progress: false

jobs:
  recover:
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository dependencies
        run: python -m pip install -e .
      - name: Enqueue fresh jobs for the fixed orphan-race dead letters
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
          OPPORTUNITYOS_ENVIRONMENT: cloud
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python scripts/fr007_recover_orphan_deadletters.py

  drain:
    needs: recover
    uses: ./.github/workflows/fr007-worker-drain.yml
    with:
      mode: drain
      max_jobs: "30"
      time_budget_seconds: "480"
    secrets: inherit
