name: FR-006 Live Evidence

on:
  pull_request:
    paths:
      - "scripts/fr006_live_poll.py"
      - "scripts/fr006_a23_live_ingest.py"
      - "scripts/fr006_exact_seed_scan.py"
      - "scripts/fr006_probe_exact_seeds.py"
      - ".github/workflows/fr006-live-evidence.yml"
      - "opportunity/**"
      - "worker/**"
      - "matching/**"
      - "storage/**"
      - "truth/**"
      - "docs/SOURCE_REGISTRY.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a9-live-poll:
    name: a9-live-poll
    # The live acceptance is deliberately scoped to the FR-006 recovery PR.
    # Normal product PRs must not acquire nondeterministic public-network gates.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.head_ref == 'fix/fr006-final-closure' ||
      github.head_ref == 'fix/fr006-public-alpha'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opportunityos
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: opportunityos_alpha
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OPPORTUNITYOS_DB_URL: postgresql+psycopg2://opportunityos:${{ github.run_id }}@localhost:5432/opportunityos_alpha
      PGPASSWORD: ${{ github.run_id }}
      FR006_LIVE_SOURCE_ID: himalayas
    steps:
      - uses: actions/checkout@v7
      - name: Detect committed A-9 closure evidence
        id: committed
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          text = Path("reports/evidence/FR-006/a9-live-poll-2026-09-12.md").read_text(encoding="utf-8")
          required = ("A-9 LIVE POLL PASS", "inserted=20", "evaluations=20", "fixture_rows=0")
          print(f"complete={str(all(item in text for item in required)).lower()}")
          PY
      - name: Set up Python
        if: steps.committed.outputs.complete != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        if: steps.committed.outputs.complete != 'true'
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Migrate fresh alpha database
        if: steps.committed.outputs.complete != 'true'
        run: alembic upgrade head
      - name: Run governed A-9 live poll
        if: steps.committed.outputs.complete != 'true'
        run: python scripts/fr006_live_poll.py
      - name: Reuse immutable A-9 evidence
        if: steps.committed.outputs.complete == 'true'
        run: echo "A-9 live acceptance already captured by run 34720287787; external poll not repeated."

  a23-exact-seed-scan:
    name: a23-exact-seed-scan
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.head_ref == 'fix/fr006-final-closure' ||
      github.head_ref == 'fix/fr006-public-alpha'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Detect committed A-23 board closure evidence
        id: committed
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data = json.loads(Path("reports/evidence/FR-006/closure-current/a23-exact-seed-probe.json").read_text(encoding="utf-8"))
          complete = data.get("live_relevant_board_total_after_union", 0) >= 300
          print(f"complete={str(complete).lower()}")
          PY
      - name: Set up Python
        if: steps.committed.outputs.complete != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Checkout public exact-link seed repositories
        if: steps.committed.outputs.complete != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/remoteintech/remote-jobs.git /tmp/remoteintech
          git clone --depth 1 https://github.com/poteto/hiring-without-whiteboards.git /tmp/hww
          git clone --depth 1 https://github.com/vanshb03/Summer2027-Internships.git /tmp/summer2027
          git clone --depth 1 https://github.com/vanshb03/New-Grad-2027.git /tmp/newgrad2027
          git clone --depth 1 https://github.com/northwesternfintech/2027QuantInternships.git /tmp/quant2027
          echo "REMOTEINTECH_SHA=$(git -C /tmp/remoteintech rev-parse HEAD)"
          echo "HWW_SHA=$(git -C /tmp/hww rev-parse HEAD)"
          echo "SUMMER2027_SHA=$(git -C /tmp/summer2027 rev-parse HEAD)"
          echo "NEWGRAD2027_SHA=$(git -C /tmp/newgrad2027 rev-parse HEAD)"
          echo "QUANT2027_SHA=$(git -C /tmp/quant2027 rev-parse HEAD)"
      - name: Extract and deduplicate exact ATS career URLs
        if: steps.committed.outputs.complete != 'true'
        run: >-
          python scripts/fr006_exact_seed_scan.py
          /tmp/remoteintech
          /tmp/hww
          /tmp/summer2027
          /tmp/newgrad2027
          /tmp/quant2027
      - name: Install discovery dependencies
        if: steps.committed.outputs.complete != 'true'
        run: pip install -e "."
      - name: Probe exact ATS boards under committed source policy
        if: steps.committed.outputs.complete != 'true'
        run: >-
          python scripts/fr006_probe_exact_seeds.py
          /tmp/remoteintech
          /tmp/hww
          /tmp/summer2027
          /tmp/newgrad2027
          /tmp/quant2027
          --output /tmp/fr006-a23-results.json
      - name: Upload A-23 probe evidence
        if: always() && steps.committed.outputs.complete != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fr006-a23-exact-probe
          path: |
            /tmp/fr006-a23-results.json
            /tmp/fr006-a23-results.registry.yaml
            /tmp/fr006-a23-results.progress.json
          if-no-files-found: error
          retention-days: 30
      - name: Reuse immutable A-23 evidence
        if: steps.committed.outputs.complete == 'true'
        run: echo "A-23 board target already captured by run 34722384079; external probe not repeated."
