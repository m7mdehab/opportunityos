name: FR-007 hosted staging bootstrap
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "bootstrap, enqueue, drain, or all"
        required: true
        default: "all"
        type: choice
        options: [bootstrap, enqueue, drain, all]
      max_jobs:
        description: "Bounded jobs per invocation"
        required: true
        default: "10"
      source_ids:
        description: "Optional explicit comma-separated source batch (maximum five IDs); never seed the whole registry"
        required: false
        default: ""
      dry_run:
        description: "Inspect without writes"
        required: true
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: fr007-hosted-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    environment: fr007-staging
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install repository
        run: python -m pip install -e .
      - name: Run bounded hosted bootstrap
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
          OPPORTUNITYOS_ENVIRONMENT: cloud
          OPPORTUNITYOS_TRUTH_PACK_PATH: ${{ vars.OPPORTUNITYOS_TRUTH_PACK_PATH || 'founder/truth_pack.yaml.gz.b64' }}
          OPOS_BOOTSTRAP_MODE: ${{ inputs.mode }}
          OPOS_BOOTSTRAP_MAX_JOBS: ${{ inputs.max_jobs }}
          OPOS_BOOTSTRAP_SOURCE_IDS: ${{ inputs.source_ids }}
          OPOS_BOOTSTRAP_DRY_RUN: ${{ inputs.dry_run }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          args=(--mode "${OPOS_BOOTSTRAP_MODE}" --max-jobs "${OPOS_BOOTSTRAP_MAX_JOBS}")
          if [[ -n "${OPOS_BOOTSTRAP_SOURCE_IDS}" ]]; then
            args+=(--source-ids "${OPOS_BOOTSTRAP_SOURCE_IDS}")
          fi
          if [[ "${OPOS_BOOTSTRAP_DRY_RUN}" == "true" ]]; then
            args+=(--dry-run)
          fi
          python scripts/fr007_hosted_bootstrap.py "${args[@]}"
