name: FR-007 Cloudflare Workers Staging Frontend

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "VALIDATE, DEPLOY_STAGING, or SMOKE_STAGING"
        required: true
        type: choice
        options: [VALIDATE, DEPLOY_STAGING, SMOKE_STAGING]
      acknowledge_staging_deployment:
        description: "Required only for DEPLOY_STAGING"
        required: false
        default: false
        type: boolean
      ref:
        description: "Optional git ref to deploy or smoke test (default: workflow branch)"
        required: false
        type: string
  workflow_call:
    inputs:
      mode:
        description: "VALIDATE, DEPLOY_STAGING, or SMOKE_STAGING"
        required: true
        type: string
      acknowledge_staging_deployment:
        description: "Required only for DEPLOY_STAGING"
        required: false
        default: false
        type: boolean
      ref:
        description: "Optional git ref to deploy or smoke test"
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate-or-deploy:
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python for static validator
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate selected mode inputs
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          ACK: ${{ inputs.acknowledge_staging_deployment }}
          API_ORIGIN: ${{ vars.OPPORTUNITYOS_API_ORIGIN }}
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://sunjfepvdzfknglrjwhm.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable__WU8LxWKBLfFaEdCIwB6Ng_RSlAJb31' }}
          STAGING_WEB_URL: ${{ vars.OPOS_STAGING_WEB_URL || 'https://opportunityos.m7mdehab.com' }}
          FOUNDER_EMAIL: ${{ secrets.E2E_FOUNDER_EMAIL }}
          FOUNDER_PASSWORD: ${{ secrets.E2E_FOUNDER_PASSWORD }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "DEPLOY_STAGING" ]; then
            [ "$ACK" = "true" ] || { echo "DEPLOY_STAGING requires explicit acknowledgement." >&2; exit 1; }
            if [ -z "$API_ORIGIN" ]; then
              case "$SUPABASE_URL" in
                https://*) ;;
                *) echo "NEXT_PUBLIC_SUPABASE_URL must be a non-empty HTTPS origin when no legacy API origin is configured." >&2; exit 1 ;;
              esac
              [ -n "$SUPABASE_ANON_KEY" ] || { echo "NEXT_PUBLIC_SUPABASE_ANON_KEY is required for the Supabase-native browser runtime." >&2; exit 1; }
            fi
            [ -n "$CF_TOKEN" ] || { echo "CLOUDFLARE_API_TOKEN is required." >&2; exit 1; }
            [ -n "$CF_ACCOUNT" ] || { echo "CLOUDFLARE_ACCOUNT_ID is required." >&2; exit 1; }
            echo "Verifying Cloudflare API token..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/tokens/verify")
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "Cloudflare token verification failed with status $HTTP_STATUS." >&2
              exit 1
            fi
          elif [ "$MODE" = "SMOKE_STAGING" ]; then
            case "$STAGING_WEB_URL" in
              https://*) ;;
              *) echo "OPOS_STAGING_WEB_URL must be a non-empty HTTPS URL." >&2; exit 1 ;;
            esac
            [ -n "$FOUNDER_EMAIL" ] || { echo "Founder staging email is required." >&2; exit 1; }
            [ -n "$FOUNDER_PASSWORD" ] || { echo "Founder staging password is required." >&2; exit 1; }
          fi

      - name: Run static Cloudflare deployment contract validation
        working-directory: .
        run: python scripts/validate_cloudflare_deployment.py

      - name: Install dependencies
        run: npm ci

      - name: Lint web application
        run: npm run lint

      - name: Build Next.js app & OpenNext Cloudflare Worker
        env:
          # VALIDATE only needs a syntactically safe origin. DEPLOY_STAGING
          # builds with the exact protected staging origin that will be
          # supplied at runtime.
          OPPORTUNITYOS_API_ORIGIN: ${{ vars.OPPORTUNITYOS_API_ORIGIN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://validation.invalid' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'validation-publishable-key' }}
          OPPORTUNITYOS_CLOUD_EDGE: "1"
        run: npx opennextjs-cloudflare build --dangerouslyUseUnsupportedNextVersion

      - name: Deploy to Cloudflare Workers (DEPLOY_STAGING)
        if: inputs.mode == 'DEPLOY_STAGING' && inputs.acknowledge_staging_deployment == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPPORTUNITYOS_API_ORIGIN: ${{ vars.OPPORTUNITYOS_API_ORIGIN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://sunjfepvdzfknglrjwhm.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable__WU8LxWKBLfFaEdCIwB6Ng_RSlAJb31' }}
        run: |
          set -euo pipefail
          VAR_ARGS=()
          if [ -n "$OPPORTUNITYOS_API_ORIGIN" ]; then
            VAR_ARGS+=(--var "OPPORTUNITYOS_API_ORIGIN:$OPPORTUNITYOS_API_ORIGIN")
          fi
          if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            VAR_ARGS+=(--var "NEXT_PUBLIC_SUPABASE_URL:$NEXT_PUBLIC_SUPABASE_URL")
          fi
          if [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            VAR_ARGS+=(--var "NEXT_PUBLIC_SUPABASE_ANON_KEY:$NEXT_PUBLIC_SUPABASE_ANON_KEY")
          fi
          npx wrangler deploy "${VAR_ARGS[@]}"

      - name: Run Cloud Playwright Smoke (SMOKE_STAGING)
        if: inputs.mode == 'SMOKE_STAGING'
        env:
          OPOS_STAGING_WEB_URL: ${{ vars.OPOS_STAGING_WEB_URL || 'https://opportunityos.m7mdehab.com' }}
          E2E_FOUNDER_EMAIL: ${{ secrets.E2E_FOUNDER_EMAIL }}
          E2E_FOUNDER_PASSWORD: ${{ secrets.E2E_FOUNDER_PASSWORD }}
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e:staging

      - name: Upload Staging Playwright Report
        if: always() && inputs.mode == 'SMOKE_STAGING'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-staging
          path: web/playwright-report-staging/
          retention-days: 7
