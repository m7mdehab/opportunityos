name: FR-007 Cloudflare Workers Staging Frontend

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "VALIDATE, DEPLOY_STAGING, or SMOKE_STAGING"
        required: true
        type: choice
        options: [VALIDATE, DEPLOY_STAGING, SMOKE_STAGING]
      acknowledge_staging_deployment:
        description: "Required only for DEPLOY_STAGING"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate-or-deploy:
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python for static validator
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate selected mode inputs
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          ACK: ${{ inputs.acknowledge_staging_deployment }}
          API_ORIGIN: ${{ vars.OPPORTUNITYOS_API_ORIGIN }}
          STAGING_WEB_URL: ${{ vars.OPOS_STAGING_WEB_URL }}
          FOUNDER_PASSWORD: ${{ secrets.E2E_FOUNDER_PASSWORD }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "DEPLOY_STAGING" ]; then
            [ "$ACK" = "true" ] || { echo "DEPLOY_STAGING requires explicit acknowledgement." >&2; exit 1; }
            case "$API_ORIGIN" in
              https://*) ;;
              *) echo "OPPORTUNITYOS_API_ORIGIN must be a non-empty HTTPS origin." >&2; exit 1 ;;
            esac
            [ -n "$CF_TOKEN" ] || { echo "CLOUDFLARE_API_TOKEN is required." >&2; exit 1; }
            [ -n "$CF_ACCOUNT" ] || { echo "CLOUDFLARE_ACCOUNT_ID is required." >&2; exit 1; }
          elif [ "$MODE" = "SMOKE_STAGING" ]; then
            case "$STAGING_WEB_URL" in
              https://*) ;;
              *) echo "OPOS_STAGING_WEB_URL must be a non-empty HTTPS URL." >&2; exit 1 ;;
            esac
            [ -n "$FOUNDER_PASSWORD" ] || { echo "Founder staging password is required." >&2; exit 1; }
          fi

      - name: Run static Cloudflare deployment contract validation
        working-directory: .
        run: python scripts/validate_cloudflare_deployment.py

      - name: Install dependencies
        run: npm ci

      - name: Lint web application
        run: npm run lint

      - name: Build Next.js app & OpenNext Cloudflare Worker
        env:
          # VALIDATE only needs a syntactically safe origin. DEPLOY_STAGING
          # builds with the exact protected staging origin that will be
          # supplied at runtime.
          OPPORTUNITYOS_API_ORIGIN: ${{ inputs.mode == 'DEPLOY_STAGING' && vars.OPPORTUNITYOS_API_ORIGIN || 'https://validation.invalid' }}
          OPPORTUNITYOS_CLOUD_EDGE: "1"
        run: npx opennextjs-cloudflare build --dangerouslyUseUnsupportedNextVersion

      - name: Deploy to Cloudflare Workers (DEPLOY_STAGING)
        if: inputs.mode == 'DEPLOY_STAGING' && inputs.acknowledge_staging_deployment == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPPORTUNITYOS_API_ORIGIN: ${{ vars.OPPORTUNITYOS_API_ORIGIN }}
        run: |
          set -euo pipefail
          npx wrangler deploy --var OPPORTUNITYOS_API_ORIGIN:"$OPPORTUNITYOS_API_ORIGIN"

      - name: Run Cloud Playwright Smoke (SMOKE_STAGING)
        if: inputs.mode == 'SMOKE_STAGING'
        env:
          OPOS_STAGING_WEB_URL: ${{ vars.OPOS_STAGING_WEB_URL }}
          E2E_FOUNDER_PASSWORD: ${{ secrets.E2E_FOUNDER_PASSWORD }}
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e:staging

      - name: Upload Staging Playwright Report
        if: always() && inputs.mode == 'SMOKE_STAGING'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-staging
          path: web/playwright-report-staging/
          retention-days: 7