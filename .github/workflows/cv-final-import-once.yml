name: CV Final Import Once

on:
  push:
    branches:
      - work/cv-canonical-final-2026-09-21
    paths:
      - .github/workflows/cv-final-import-once.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=opos-cv-final-import")"
          TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$RESPONSE")"
          echo "::add-mask::$TOKEN"
          printf 'token=%s\n' "$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Promote canonical CV pack to private Supabase storage
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          HTTP_STATUS="$(curl -sS --max-time 420 -o /tmp/import-result.json -w '%{http_code}' \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "https://lrrcpwaapwynzdsxzwhy.supabase.co/functions/v1/opos-cv-final-import")"
          echo "http_status=$HTTP_STATUS"
          cat /tmp/import-result.json
          echo
          python - <<'PY'
          import json
          payload=json.load(open("/tmp/import-result.json",encoding="utf-8"))
          if not payload.get("ok"):
              raise SystemExit(payload)
          print("canonical_cv_import=PASS")
          print("uploaded_count=",payload.get("uploaded_count"))
          print("zip_sha256=",payload.get("zip_sha256"))
          PY
