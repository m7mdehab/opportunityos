name: FR-007 Current Readiness Launcher

on:
  workflow_dispatch:
    inputs:
      truth_pack_hash:
        description: "Authoritative truth-pack hash (leave blank to discover it)"
        required: false
        default: ""
      mode:
        description: "Closure mode, Storage V2 CI (storage-v2-ci), or new DB credential probe (db-credential-probe)"
        required: false
        default: "full"

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

jobs:
  storage-v2-proof:
    if: ${{ inputs.mode == 'storage-v2-ci' || inputs.mode == 'db-credential-probe' }}
    uses: ./.github/workflows/fr007-storage-v2-postgres.yml
    with:
      mode: ${{ inputs.mode == 'db-credential-probe' && 'credential-probe' || 'postgres-ci' }}
    secrets: inherit
  final-closure:
    if: ${{ inputs.mode != 'storage-v2-ci' && inputs.mode != 'db-credential-probe' }}
    uses: ./.github/workflows/fr007-final-runtime-closure.yml
    with:
      truth_pack_hash: ${{ inputs.truth_pack_hash }}
      mode: ${{ inputs.mode }}
    secrets: inherit
