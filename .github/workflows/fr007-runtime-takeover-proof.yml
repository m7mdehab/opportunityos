name: FR-007 Runtime Takeover Proof

on:
  push:
    branches:
      - main
      - work/fr007-overseer-integration
      - work/fr007-codex-runtime-takeover
    paths:
      - storage/engine.py
      - worker/**
      - scripts/fr007_hosted_bootstrap.py
      - scripts/fr007_cloud_monitor.py
      - scripts/fr007_reliability_proof.py
      - scripts/fr007_soak_snapshot.py
      - scripts/process_incident_alert.py
      - scripts/test_fr007_cloud_monitor.py
      - scripts/test_fr007_connection_pressure.py
      - scripts/test_w17_runtime_workflows.py
      - .github/workflows/fr007-worker-drain.yml
      - .github/workflows/fr007-runtime-takeover-proof.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: fr007-runtime-takeover-proof
  cancel-in-progress: false

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opportunityos
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: opportunityos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OPPORTUNITYOS_DB_URL: postgresql+psycopg2://opportunityos:${{ github.run_id }}@localhost:5432/opportunityos_test
      CLOUD_DATABASE_URL: postgresql+psycopg2://opportunityos:${{ github.run_id }}@localhost:5432/opportunityos_test
      PGPASSWORD: ${{ github.run_id }}
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install repository
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Migrate disposable PostgreSQL
        run: alembic upgrade head
      - name: Run runtime regression suites
        run: |
          python -m unittest \
            worker.test_worker \
            worker.test_runner \
            worker.test_postgres_queue_durability \
            scripts.test_w17_runtime_workflows \
            scripts.test_fr007_cloud_monitor \
            scripts.test_fr007_connection_pressure \
            -v
      - name: Compile runtime modules
        run: |
          python -m py_compile \
            storage/engine.py \
            worker/queue.py \
            worker/runner.py \
            worker/handlers.py \
            scripts/fr007_hosted_bootstrap.py \
            scripts/fr007_cloud_monitor.py \
            scripts/fr007_soak_snapshot.py \
            scripts/process_incident_alert.py
      - name: Repository integrity and guard
        run: |
          python scripts/check_repository.py
          python scripts/check_guard.py --allow-missing-patterns

  enqueue:
    needs: deterministic
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install repository
        run: python -m pip install -e .
      - name: Enqueue due sources once
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
          OPPORTUNITYOS_ENVIRONMENT: cloud
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python scripts/fr007_hosted_bootstrap.py --mode enqueue

  drain:
    needs: enqueue
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install repository
        run: python -m pip install -e .
      - name: Drain one bounded shard
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
          OPPORTUNITYOS_ENVIRONMENT: cloud
          OPPORTUNITYOS_TRUTH_PACK_PATH: founder/truth_pack.yaml.gz.b64
          OPOS_WORKER_ID: "runtime-takeover-${{ github.run_id }}-${{ matrix.shard }}"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python scripts/fr007_hosted_bootstrap.py \
            --mode drain \
            --max-jobs 30 \
            --time-budget-seconds 480 \
            --worker-id "${OPOS_WORKER_ID}"

  observe:
    needs: enqueue
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      max_worker_connections: ${{ steps.observe.outputs.max_worker_connections }}
      max_idle_in_transaction: ${{ steps.observe.outputs.max_idle_in_transaction }}
      max_unattributed_postgres: ${{ steps.observe.outputs.max_unattributed_postgres }}
      probe_failures: ${{ steps.observe.outputs.probe_failures }}
      proof_pass: ${{ steps.observe.outputs.proof_pass }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install repository
        run: python -m pip install -e .
      - name: Observe peak worker connection pressure
        id: observe
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
        run: |
          python - <<'PY'
          import os
          import time
          from sqlalchemy import create_engine, text

          engine = create_engine(
              os.environ["OPOS_TARGET_DB_URL"],
              pool_size=1,
              max_overflow=0,
              pool_pre_ping=True,
              connect_args={"application_name": "opportunityos-fr007-proof"},
          )
          max_worker = 0
          max_idle_tx = 0
          max_unattributed = 0
          failures = 0

          for _ in range(72):
              try:
                  with engine.connect() as conn:
                      row = conn.execute(text("""
                          select
                            count(*)::int as total,
                            count(*) filter (
                              where state = 'idle in transaction'
                                and xact_start is not null
                                and now() - xact_start > interval '30 seconds'
                            )::int as idle_tx
                          from pg_stat_activity
                          where application_name = 'opportunityos-fr007-worker'
                      """)).mappings().one()
                      unattributed = conn.execute(text("""
                          select count(*)::int
                          from pg_stat_activity
                          where usename = 'postgres'
                            and coalesce(application_name, '') = ''
                            and client_addr is not null
                      """)).scalar_one()
                      max_worker = max(max_worker, int(row["total"]))
                      max_idle_tx = max(max_idle_tx, int(row["idle_tx"]))
                      max_unattributed = max(max_unattributed, int(unattributed))
              except Exception as exc:
                  failures += 1
                  print(f"PROBE_FAILURE={type(exc).__name__}: {str(exc)[:240]}")
              time.sleep(5)

          engine.dispose()
          proof_pass = failures == 0 and 1 <= max_worker <= 10 and max_idle_tx == 0
          print(f"MAX_WORKER_CONNECTIONS={max_worker}")
          print(f"MAX_IDLE_IN_TRANSACTION={max_idle_tx}")
          print(f"MAX_UNATTRIBUTED_POSTGRES={max_unattributed}")
          print(f"PROBE_FAILURES={failures}")
          print(f"CONNECTION_PROOF_PASS={str(proof_pass).lower()}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"max_worker_connections={max_worker}\n")
              fh.write(f"max_idle_in_transaction={max_idle_tx}\n")
              fh.write(f"max_unattributed_postgres={max_unattributed}\n")
              fh.write(f"probe_failures={failures}\n")
              fh.write(f"proof_pass={str(proof_pass).lower()}\n")

          if not proof_pass:
              raise SystemExit("connection-pressure acceptance failed")
          PY

  summarize:
    if: always()
    needs: [deterministic, enqueue, drain, observe]
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install repository
        run: python -m pip install -e .
      - name: Capture live queue snapshot
        id: queue
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(
              os.environ["OPOS_TARGET_DB_URL"],
              pool_size=1,
              max_overflow=0,
              connect_args={"application_name": "opportunityos-fr007-proof-summary"},
          )
          with engine.connect() as conn:
              row = conn.execute(text("""
                  select
                    count(*) filter (
                      where status in ('PENDING','RETRY')
                        and coalesce(run_after, created_at) <= now()
                    )::bigint as due_runnable,
                    coalesce(extract(epoch from (
                      now() - min(coalesce(run_after, created_at)) filter (
                        where status in ('PENDING','RETRY')
                          and coalesce(run_after, created_at) <= now()
                      )
                    )), 0)::bigint as oldest_due_age_seconds,
                    count(*) filter (where status='RUNNING')::bigint as running_now,
                    count(*) filter (
                      where status='RUNNING' and lease_expires_at < now()
                    )::bigint as expired_running_leases,
                    count(*) filter (where status='DEAD_LETTER')::bigint as dead_letter
                  from worker_jobs
              """)).mappings().one()
              revision = conn.execute(text("select version_num from alembic_version limit 1")).scalar_one()
              latest_poll = conn.execute(text("""
                  select max(finished_at)
                  from source_poll_runs
                  where status='ok'
              """)).scalar()
          engine.dispose()

          snapshot = dict(row)
          snapshot["revision"] = str(revision)
          snapshot["latest_successful_poll"] = str(latest_poll)
          compact = json.dumps(snapshot, separators=(",", ":"))
          print("QUEUE_SNAPSHOT=" + compact)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("snapshot=" + compact + "\n")
          PY
      - name: Post sanitized proof result to PR 139
        env:
          GH_TOKEN: ${{ github.token }}
          DETERMINISTIC: ${{ needs.deterministic.result }}
          ENQUEUE: ${{ needs.enqueue.result }}
          DRAIN: ${{ needs.drain.result }}
          OBSERVE: ${{ needs.observe.result }}
          MAX_CONN: ${{ needs.observe.outputs.max_worker_connections }}
          MAX_IDLE_TX: ${{ needs.observe.outputs.max_idle_in_transaction }}
          MAX_UNATTRIBUTED: ${{ needs.observe.outputs.max_unattributed_postgres }}
          PROBE_FAILURES: ${{ needs.observe.outputs.probe_failures }}
          PROOF_PASS: ${{ needs.observe.outputs.proof_pass }}
          QUEUE_SNAPSHOT: ${{ steps.queue.outputs.snapshot }}
        run: |
          cat > /tmp/proof-comment.md <<EOF
          <!-- fr007-runtime-takeover-proof -->
          ## W22.3 runtime takeover proof — run ${{ github.run_id }}

          - deterministic: ${DETERMINISTIC}
          - enqueue: ${ENQUEUE}
          - five-shard drain: ${DRAIN}
          - connection observer: ${OBSERVE}
          - max tagged worker connections: ${MAX_CONN:-unknown}
          - max persistent (>30s) idle-in-transaction tagged workers: ${MAX_IDLE_TX:-unknown}
          - max unattributed postgres connections: ${MAX_UNATTRIBUTED:-unknown}
          - observer connection failures: ${PROBE_FAILURES:-unknown}
          - connection proof pass: ${PROOF_PASS:-false}
          - post-run queue snapshot: ${QUEUE_SNAPSHOT}

          This is runtime proof evidence only; it does not self-declare FR-007 closed.
          EOF
          gh pr comment 139 --body-file /tmp/proof-comment.md
      - name: Enforce proof job result
        env:
          DETERMINISTIC: ${{ needs.deterministic.result }}
          ENQUEUE: ${{ needs.enqueue.result }}
          DRAIN: ${{ needs.drain.result }}
          OBSERVE: ${{ needs.observe.result }}
          PROOF_PASS: ${{ needs.observe.outputs.proof_pass }}
        run: |
          test "${DETERMINISTIC}" = "success"
          test "${ENQUEUE}" = "success"
          test "${DRAIN}" = "success"
          test "${OBSERVE}" = "success"
          test "${PROOF_PASS}" = "true"

