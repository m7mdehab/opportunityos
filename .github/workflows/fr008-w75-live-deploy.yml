name: OpportunityOS Main Live Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  migrate-live-founder:
    name: Migrate live Founder database
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install repository database tooling
        run: python -m pip install -e .
      - name: Apply the exact main migration head
        env:
          OPPORTUNITYOS_DB_URL: ${{ secrets.CLOUD_DATABASE_URL }}
          CI: "true"
        run: |
          set -euo pipefail
          alembic upgrade head
          test "$(alembic heads | grep -c ' (head)')" = 1
          alembic current | grep '0026_fr008_live_actions'

  deploy-live-founder:
    needs: migrate-live-founder
    uses: ./.github/workflows/fr007-cloudflare-staging-deploy.yml
    with:
      mode: DEPLOY_STAGING
      acknowledge_staging_deployment: true
      ref: ${{ github.sha }}
    secrets: inherit

  smoke-live-founder:
    needs: deploy-live-founder
    uses: ./.github/workflows/fr007-cloudflare-staging-deploy.yml
    with:
      mode: SMOKE_STAGING
      acknowledge_staging_deployment: false
      ref: ${{ github.sha }}
    secrets: inherit
