name: OpportunityOS Main Live Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  migrate-live-founder:
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      bc_canary: ${{ steps.release.outputs.bc_canary }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Detect bounded BC candidate release
        id: release
        shell: bash
        run: |
          changed_files="$(git diff-tree --no-commit-id --name-only -r HEAD HEAD^)"
          if grep -Eq '^(scripts/bc_candidate_canary\.py|\.github/workflows/fr008-w75-live-deploy\.yml|reports/evidence/BC/)' <<<"$changed_files"; then
            echo "bc_canary=true" >> "$GITHUB_OUTPUT"
          else
            echo "bc_canary=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install repository database tooling
        run: python -m pip install -e .
      - name: Apply exact repository migration head
        env:
          OPPORTUNITYOS_DB_URL: ${{ secrets.CLOUD_DATABASE_URL }}
          CI: "true"
        run: |
          set -euo pipefail
          alembic upgrade head
          test "$(alembic heads | grep -c ' (head)')" = 1
          expected_head="$(alembic heads | awk 'NR == 1 { print $1 }')"
          current_head="$(alembic current | awk 'NR == 1 { print $1 }')"
          test -n "$expected_head"
          test "$current_head" = "$expected_head"

  refresh-bounded-feed-candidates:
    needs: migrate-live-founder
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install repository database tooling
        run: python -m pip install -e .
      - name: Read-only bounded candidate dry run
        if: needs.migrate-live-founder.outputs.bc_canary != 'true'
        env:
          OPPORTUNITYOS_DB_URL: ${{ secrets.CLOUD_DATABASE_URL }}
          OPPORTUNITYOS_ENVIRONMENT: cloud
          OPPORTUNITYOS_TRUTH_PACK_PATH: founder/truth_pack.yaml.gz.b64
        run: python -m scripts.refresh_feed_projection_candidates --discover-current-candidates --candidate-limit 50
      - name: Refresh bounded actionable candidates
        if: needs.migrate-live-founder.outputs.bc_canary != 'true'
        env:
          OPPORTUNITYOS_DB_URL: ${{ secrets.CLOUD_DATABASE_URL }}
          OPPORTUNITYOS_ENVIRONMENT: cloud
          OPPORTUNITYOS_TRUTH_PACK_PATH: founder/truth_pack.yaml.gz.b64
        run: python -m scripts.refresh_feed_projection_candidates --discover-current-candidates --candidate-limit 50 --execute
      - name: Refresh only the reviewed BC candidate set
        if: needs.migrate-live-founder.outputs.bc_canary == 'true'
        env:
          OPPORTUNITYOS_DB_URL: ${{ secrets.CLOUD_DATABASE_URL }}
          OPPORTUNITYOS_ENVIRONMENT: cloud
          OPPORTUNITYOS_TRUTH_PACK_PATH: founder/truth_pack.yaml.gz.b64
        run: python -m scripts.bc_candidate_canary --execute

  deploy-live-founder:
    needs: [migrate-live-founder, refresh-bounded-feed-candidates]
    uses: ./.github/workflows/fr007-cloudflare-staging-deploy.yml
    with:
      mode: DEPLOY_STAGING
      acknowledge_staging_deployment: true
      ref: ${{ github.sha }}
    secrets: inherit

  smoke-live-founder:
    needs: deploy-live-founder
    uses: ./.github/workflows/fr007-cloudflare-staging-deploy.yml
    with:
      mode: SMOKE_STAGING
      acknowledge_staging_deployment: false
      ref: ${{ github.sha }}
    secrets: inherit
