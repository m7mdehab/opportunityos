name: FR-007 Azure staging deployment

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "VALIDATE, WHAT_IF, or DEPLOY_STAGING"
        required: true
        type: choice
        options: [VALIDATE, WHAT_IF, DEPLOY_STAGING]
      acknowledge_staging_deployment:
        description: "Required only for DEPLOY_STAGING"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_MANAGED_ENVIRONMENT_ID: ${{ vars.AZURE_MANAGED_ENVIRONMENT_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      OPOS_AZURE_NAME_PREFIX: ${{ vars.OPOS_AZURE_NAME_PREFIX }}
      OPOS_AZURE_IMAGE: ${{ vars.OPOS_AZURE_IMAGE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static deployment contract validation
        run: python scripts/validate_cloud_deployment.py --image "$OPOS_AZURE_IMAGE"
      - name: Validate Bicep syntax
        if: inputs.mode == 'VALIDATE'
        run: az bicep build --file infra/azure/main.bicep --stdout > "$RUNNER_TEMP/fr007-main.bicep.json"
      - name: Azure OIDC login
        if: inputs.mode != 'VALIDATE'
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Prepare deployment parameters
        if: inputs.mode != 'VALIDATE'
        env:
          CLOUD_DATABASE_URL: ${{ secrets.CLOUD_DATABASE_URL }}
          OPPORTUNITYOS_FOUNDER_PASSWORD: ${{ secrets.OPPORTUNITYOS_FOUNDER_PASSWORD }}
          OPPORTUNITYOS_SESSION_SECRET: ${{ secrets.OPPORTUNITYOS_SESSION_SECRET }}
          OPPORTUNITYOS_TRUTH_PACK_URI: ${{ secrets.OPPORTUNITYOS_TRUTH_PACK_URI }}
          OPPORTUNITYOS_TRUTH_PACK_HASH: ${{ secrets.OPPORTUNITYOS_TRUTH_PACK_HASH }}
        run: |
          set -euo pipefail
          PARAM_FILE="$RUNNER_TEMP/fr007-azure-parameters.json"
          export PARAM_FILE
          python - <<'PY'
          import json, os
          payload = {
              "existingManagedEnvironmentResourceId": {"value": os.environ["AZURE_MANAGED_ENVIRONMENT_ID"]},
              "namePrefix": {"value": os.environ["OPOS_AZURE_NAME_PREFIX"]},
              "image": {"value": os.environ["OPOS_AZURE_IMAGE"]},
              "cloudDatabaseUrl": {"value": os.environ["CLOUD_DATABASE_URL"]},
              "founderPassword": {"value": os.environ["OPPORTUNITYOS_FOUNDER_PASSWORD"]},
              "sessionSecret": {"value": os.environ["OPPORTUNITYOS_SESSION_SECRET"]},
              "truthPackUri": {"value": os.environ["OPPORTUNITYOS_TRUTH_PACK_URI"]},
              "truthPackHash": {"value": os.environ["OPPORTUNITYOS_TRUTH_PACK_HASH"]}
          }
          with open(os.environ["PARAM_FILE"], "w", encoding="utf-8") as stream:
              json.dump({"$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#", "contentVersion": "1.0.0", "parameters": payload}, stream)
          PY
          chmod 600 "$PARAM_FILE"
      - name: Azure what-if
        if: inputs.mode == 'WHAT_IF'
        run: az deployment group what-if --resource-group "$AZURE_RESOURCE_GROUP" --template-file infra/azure/main.bicep --parameters @"$RUNNER_TEMP/fr007-azure-parameters.json"
      - name: Deploy migration job only
        if: inputs.mode == 'DEPLOY_STAGING' && inputs.acknowledge_staging_deployment == true
        run: az deployment group create --resource-group "$AZURE_RESOURCE_GROUP" --template-file infra/azure/main.bicep --parameters @"$RUNNER_TEMP/fr007-azure-parameters.json" deployApplicationRoles=false
      - name: Run migration job and require successful completion
        if: inputs.mode == 'DEPLOY_STAGING' && inputs.acknowledge_staging_deployment == true
        run: |
          set -euo pipefail
          JOB_NAME="${OPOS_AZURE_NAME_PREFIX}-migrate"
          BEFORE_EXECUTION="$(az containerapp job execution list --name "$JOB_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query "sort_by(@,&properties.startTime)[-1].name" -o tsv 2>/dev/null || true)"
          az containerapp job start --name "$JOB_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --only-show-errors >/dev/null

          EXECUTION_NAME=""
          for _ in $(seq 1 30); do
            LATEST="$(az containerapp job execution list --name "$JOB_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query "sort_by(@,&properties.startTime)[-1].name" -o tsv 2>/dev/null || true)"
            if [ -n "$LATEST" ] && [ "$LATEST" != "$BEFORE_EXECUTION" ]; then
              EXECUTION_NAME="$LATEST"
              break
            fi
            sleep 5
          done
          if [ -z "$EXECUTION_NAME" ]; then
            echo "Migration execution did not become observable; refusing application rollout." >&2
            exit 1
          fi

          for _ in $(seq 1 180); do
            STATUS="$(az containerapp job execution show --name "$JOB_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --job-execution-name "$EXECUTION_NAME" --query "properties.status" -o tsv)"
            case "$STATUS" in
              Succeeded)
                echo "Migration execution succeeded."
                exit 0
                ;;
              Failed|Stopped|Degraded)
                echo "Migration execution failed with status: $STATUS; refusing application rollout." >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Migration execution timed out before success; refusing application rollout." >&2
          exit 1
      - name: Deploy API worker and scheduler
        if: inputs.mode == 'DEPLOY_STAGING' && inputs.acknowledge_staging_deployment == true
        run: az deployment group create --resource-group "$AZURE_RESOURCE_GROUP" --template-file infra/azure/main.bicep --parameters @"$RUNNER_TEMP/fr007-azure-parameters.json" deployApplicationRoles=true
      - name: Reject unacknowledged deployment
        if: inputs.mode == 'DEPLOY_STAGING' && inputs.acknowledge_staging_deployment != true
        run: echo "DEPLOY_STAGING requires acknowledge_staging_deployment=true" >&2; exit 2
      - name: Remove temporary parameters
        if: always()
        run: rm -f "$RUNNER_TEMP/fr007-azure-parameters.json" "$RUNNER_TEMP/fr007-main.bicep.json"
