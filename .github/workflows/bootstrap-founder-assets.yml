name: Bootstrap Founder Truth and CV Catalog

on:
  push:
    branches:
      - feature/fixed-cv-catalog
    paths:
      - ".github/workflows/bootstrap-founder-assets.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fixed-cv-catalog
      - name: Decode canonical founder assets
        env:
          TRUTH_B64GZ: ""
          CATALOG_B64GZ: ""
        run: |
          set -euo pipefail
          mkdir -p founder
          python - <<'PY'
          import base64, gzip, os, pathlib, hashlib
          assets = {
              "founder/truth_pack.yaml": os.environ["TRUTH_B64GZ"],
              "founder/cv_catalog.json": os.environ["CATALOG_B64GZ"],
          }
          expected = {
              "founder/truth_pack.yaml": "5f2d986f41a51b2b4f4ebd6c38303ea2b7ca41f48c33c104ae4c1b7f6b5a15d8",
              "founder/cv_catalog.json": "1137c7261dd8ddc35124a173da39d63e1876f6bece5037099d0bc5f0c5177822",
          }
          for path, encoded in assets.items():
              raw = gzip.decompress(base64.b64decode(encoded))
              actual = hashlib.sha256(raw).hexdigest()
              if actual != expected[path]:
                  raise SystemExit(f"{path}: hash mismatch {actual}")
              pathlib.Path(path).write_bytes(raw)
              print(path, len(raw), actual)
          PY
      - name: Commit canonical founder assets
        run: |
          set -euo pipefail
          git config user.name "opportunityos-owner"
          git config user.email "actions@users.noreply.github.com"
          git add founder/truth_pack.yaml founder/cv_catalog.json
          git diff --cached --quiet && exit 0
          git commit -m "founder: lock final truth pack and fixed CV catalog"
          git push origin HEAD:feature/fixed-cv-catalog
