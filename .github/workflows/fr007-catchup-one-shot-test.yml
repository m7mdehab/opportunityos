name: FR-007 one-shot catch-up dispatch test

on:
  push:
    branches:
      - ops/run-worker-validation-now
    paths:
      - .github/workflows/fr007-catchup-one-shot-test.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch production catch-up without repository checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run fr007-due-source-overnight-catchup.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f operation=auto
