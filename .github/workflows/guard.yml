name: Guard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    # Pure checkout + Python repository scan. Keep the same guard on the lower-cost slim runner.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      FOUNDER_NAME_PATTERNS: ${{ secrets.FOUNDER_NAME_PATTERNS }}
    steps:
      - uses: actions/checkout@v7
      - name: Scan secrets and mirrored PII
        run: python scripts/check_guard.py
