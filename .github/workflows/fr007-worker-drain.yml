name: FR-007 durable worker drain

on:
  workflow_dispatch:
    inputs:
      max_jobs:
        description: "Maximum jobs to drain in this bounded recovery run (capped to 150)"
        required: false
        default: "10"
      time_budget_seconds:
        description: "Time budget in seconds (capped to 540)"
        required: false
        default: "300"
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/fr007-worker-drain.yml

permissions:
  contents: read

concurrency:
  group: fr007-worker-drain
  cancel-in-progress: false

jobs:
  drain:
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository dependencies
        run: python -m pip install -e .
      - name: Enqueue due sources and drain a bounded durable queue slice
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
          OPPORTUNITYOS_ENVIRONMENT: cloud
          OPPORTUNITYOS_TRUTH_PACK_PATH: founder/truth_pack.yaml.gz.b64
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          RAW_MAX="${{ inputs.max_jobs || '10' }}"
          RAW_BUDGET="${{ inputs.time_budget_seconds || '300' }}"
          MAX_JOBS=$(( RAW_MAX > 150 ? 150 : (RAW_MAX < 1 ? 10 : RAW_MAX) ))
          TIME_BUDGET=$(( RAW_BUDGET > 540 ? 540 : (RAW_BUDGET < 10 ? 300 : RAW_BUDGET) ))
          python scripts/fr007_hosted_bootstrap.py --mode all --max-jobs "${MAX_JOBS}" --time-budget-seconds "${TIME_BUDGET}"
