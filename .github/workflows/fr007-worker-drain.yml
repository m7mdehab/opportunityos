name: FR-007 durable worker drain

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: fr007-worker-drain
  cancel-in-progress: false

jobs:
  drain:
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository dependencies
        run: python -m pip install -e .
      - name: Enqueue due work and drain a bounded durable queue slice
        env:
          OPPORTUNITYOS_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
          OPPORTUNITYOS_ENVIRONMENT: cloud
          OPPORTUNITYOS_MAX_ENQUEUES_PER_TICK: "16"
        run: |
          set -euo pipefail
          # Refresh the durable read-policy snapshot from SOURCE_REGISTRY and
          # enqueue at most one bounded due batch before consuming work.
          python -m worker --poll-now
          for _ in $(seq 1 16); do
            python -m worker --once
          done
