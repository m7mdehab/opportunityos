name: FR-007 durable worker drain
# Runtime takeover recovery waves are intentionally bounded and observable.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode for bootstrap (all, drain, enqueue)"
        required: false
        default: "all"
      max_jobs:
        description: "Maximum jobs to drain per shard in this bounded recovery run (capped to 150)"
        required: false
        default: "30"
      time_budget_seconds:
        description: "Time budget in seconds per shard (capped to 540)"
        required: false
        default: "480"
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - main
      - work/fr007-overseer-integration
      - work/fr007-codex-runtime-takeover
    paths:
      - .github/workflows/fr007-worker-drain.yml

permissions:
  contents: read

concurrency:
  group: fr007-worker-drain
  cancel-in-progress: false

jobs:
  enqueue:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'all' || inputs.mode == 'enqueue' || inputs.mode == '' }}
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository dependencies
        run: python -m pip install -e .
      - name: Enqueue due sources under durable PostgreSQL schedule
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
          OPPORTUNITYOS_ENVIRONMENT: cloud
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python scripts/fr007_hosted_bootstrap.py --mode enqueue

  drain:
    needs: [enqueue]
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'all' || inputs.mode == 'drain') && (needs.enqueue.result == 'success' || inputs.mode == 'drain') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository dependencies
        run: python -m pip install -e .
      - name: Drain bounded durable queue slice on shard
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
          OPPORTUNITYOS_ENVIRONMENT: cloud
          OPPORTUNITYOS_TRUTH_PACK_PATH: founder/truth_pack.yaml.gz.b64
          OPOS_WORKER_ID: "hosted-bootstrap-${{ github.run_id }}-${{ matrix.shard }}"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          RAW_MAX="${{ inputs.max_jobs || '30' }}"
          RAW_BUDGET="${{ inputs.time_budget_seconds || '480' }}"
          MAX_JOBS=$(( RAW_MAX > 150 ? 150 : (RAW_MAX < 1 ? 30 : RAW_MAX) ))
          TIME_BUDGET=$(( RAW_BUDGET > 540 ? 540 : (RAW_BUDGET < 10 ? 480 : RAW_BUDGET) ))
          python scripts/fr007_hosted_bootstrap.py --mode drain --max-jobs "${MAX_JOBS}" --time-budget-seconds "${TIME_BUDGET}" --worker-id "${OPOS_WORKER_ID}"
