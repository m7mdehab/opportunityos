name: FR-007 frozen due-source resilient catch-up

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Run the autonomous state machine or a legacy supervised operation
        required: true
        type: choice
        options: [auto, freeze-manifest, run-cohort, finalize]
        default: auto
      previous_run_id:
        description: Previous catch-up run that uploaded the checkpoint artifact
        required: false
        default: ""
      cohort_index:
        description: Legacy zero-based sequential 50-source cohort index
        required: false
        default: "0"
      maintenance_run_id:
        description: Successful maintenance-only run authorizing progress above 380 MiB
        required: false
        default: ""
  schedule:
    # Single production discovery owner: twice daily. Continuations self-dispatch
    # only while a frozen manifest still has safe work remaining.
    - cron: "17 */12 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: fr007-worker-drain
  cancel-in-progress: false

jobs:
  catch-up:
    if: github.ref == 'refs/heads/main'
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository
        run: python -m pip install -e .

      - name: Download previous checkpoint
        if: ${{ (inputs.previous_run_id || '') != '' && (inputs.operation == 'auto' || inputs.operation == 'run-cohort' || inputs.operation == 'finalize') }}
        uses: actions/download-artifact@v4
        with:
          name: fr007-overnight-catchup-state
          path: catchup-state
          run-id: ${{ inputs.previous_run_id }}
          github-token: ${{ github.token }}

      - name: Freeze current due/read-allowed manifest
        if: ${{ ((github.event_name == 'schedule' || inputs.operation == 'auto') && (inputs.previous_run_id || '') == '') || inputs.operation == 'freeze-manifest' }}
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
          OPPORTUNITYOS_ENVIRONMENT: cloud
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/fr007_due_source_catchup.py --freeze --state-file catchup-state/catchup-state.json

      - name: Execute one resilient checkpointed wave
        id: auto-step
        if: ${{ github.event_name == 'schedule' || inputs.operation == 'auto' }}
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
          SUPABASE_STORAGE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL || 'https://sunjfepvdzfknglrjwhm.supabase.co' }}
          STORAGE_SERVICE_KEY: ${{ secrets.STORAGE_SERVICE_KEY }}
          OPPORTUNITYOS_ENVIRONMENT: cloud
          OPPORTUNITYOS_TRUTH_PACK_PATH: founder/truth_pack.yaml.gz.b64
          PYTHONPATH: ${{ github.workspace }}
          MAINTENANCE_RUN_ID: ${{ inputs.maintenance_run_id || '' }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ -n "${MAINTENANCE_RUN_ID}" ]]; then
            EXTRA+=(--maintenance-run-id "${MAINTENANCE_RUN_ID}")
          fi
          python scripts/fr007_due_source_catchup.py             --step             --state-file catchup-state/catchup-state.json             "${EXTRA[@]}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          state = json.loads(Path("catchup-state/catchup-state.json").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"status={state.get('status', '')}\n")
              handle.write(f"result_count={len(state.get('results', {}))}\n")
          PY

      - name: Finalize autonomous frozen manifest
        if: ${{ steps.auto-step.outputs.status == 'READY_TO_FINALIZE' }}
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
          SUPABASE_STORAGE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL || 'https://sunjfepvdzfknglrjwhm.supabase.co' }}
          STORAGE_SERVICE_KEY: ${{ secrets.STORAGE_SERVICE_KEY }}
          OPPORTUNITYOS_ENVIRONMENT: cloud
          OPPORTUNITYOS_TRUTH_PACK_PATH: founder/truth_pack.yaml.gz.b64
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/fr007_due_source_catchup.py --finalize --state-file catchup-state/catchup-state.json

      - name: Execute one legacy sequential 50-source cohort
        if: inputs.operation == 'run-cohort'
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
          SUPABASE_STORAGE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL || 'https://sunjfepvdzfknglrjwhm.supabase.co' }}
          STORAGE_SERVICE_KEY: ${{ secrets.STORAGE_SERVICE_KEY }}
          OPPORTUNITYOS_ENVIRONMENT: cloud
          OPPORTUNITYOS_TRUTH_PACK_PATH: founder/truth_pack.yaml.gz.b64
          PYTHONPATH: ${{ github.workspace }}
          MAINTENANCE_RUN_ID: ${{ inputs.maintenance_run_id || '' }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ -n "${MAINTENANCE_RUN_ID}" ]]; then
            EXTRA+=(--maintenance-run-id "${MAINTENANCE_RUN_ID}")
          fi
          python scripts/fr007_due_source_catchup.py             --cohort-index "${{ inputs.cohort_index }}"             --state-file catchup-state/catchup-state.json             "${EXTRA[@]}"

      - name: Legacy final verification
        if: inputs.operation == 'finalize'
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
          SUPABASE_STORAGE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL || 'https://sunjfepvdzfknglrjwhm.supabase.co' }}
          STORAGE_SERVICE_KEY: ${{ secrets.STORAGE_SERVICE_KEY }}
          OPPORTUNITYOS_ENVIRONMENT: cloud
          OPPORTUNITYOS_TRUTH_PACK_PATH: founder/truth_pack.yaml.gz.b64
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/fr007_due_source_catchup.py --finalize --state-file catchup-state/catchup-state.json

      - name: Upload sanitized manifest and checkpoint
        if: always() && hashFiles('catchup-state/catchup-state.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: fr007-overnight-catchup-state
          path: catchup-state/catchup-state.json
          if-no-files-found: error
          retention-days: 30

      - name: Continue autonomous catch-up
        if: ${{ steps.auto-step.outputs.status == 'STEP_COMPLETE' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run fr007-due-source-overnight-catchup.yml             --repo "${GITHUB_REPOSITORY}"             --ref main             -f operation=auto             -f previous_run_id="${{ github.run_id }}"

      - name: Request bounded maintenance before resuming
        if: ${{ steps.auto-step.outputs.status == 'MAINTENANCE_REQUIRED' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run fr007-hot-evaluation-capacity-reclaim.yml             --repo "${GITHUB_REPOSITORY}"             --ref main             -f operation=maintenance-only             -f resume_catchup_run_id="${{ github.run_id }}"

      - name: Surface capacity circuit-breaker
        if: ${{ steps.auto-step.outputs.status == 'CAPACITY_BLOCKED' }}
        run: |
          echo "::error::Catch-up stopped safely because maintenance could not create enough verified headroom."
          exit 1
