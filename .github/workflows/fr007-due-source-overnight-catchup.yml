name: FR-007 frozen due-source overnight catch-up

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Freeze the manifest, run a 50-source cohort, or perform final live verification
        required: true
        type: choice
        options: [freeze-manifest, run-cohort, finalize]
      previous_run_id:
        description: Successful run that uploaded the frozen manifest/state artifact; blank only for freeze-manifest
        required: false
        default: ""
      cohort_index:
        description: Zero-based sequential cohort index (maximum seven cohorts for the frozen manifest)
        required: false
        default: "0"
      maintenance_run_id:
        description: Fresh successful maintenance-only run ID authorizing one bounded cohort after a capacity pause
        required: false
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: fr007-worker-drain
  cancel-in-progress: false

jobs:
  catch-up:
    if: github.ref == 'refs/heads/main'
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository
        run: python -m pip install -e .
      - name: Download the previous frozen manifest checkpoint
        if: inputs.operation == 'run-cohort' || inputs.operation == 'finalize'
        uses: actions/download-artifact@v4
        with:
          name: fr007-overnight-catchup-state
          path: catchup-state
          run-id: ${{ inputs.previous_run_id }}
          github-token: ${{ github.token }}
      - name: Freeze the current due/read-allowed manifest
        if: inputs.operation == 'freeze-manifest'
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
          OPPORTUNITYOS_ENVIRONMENT: cloud
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/fr007_due_source_catchup.py --freeze --state-file catchup-state/catchup-state.json
      - name: Execute one sequential 50-source cohort
        if: inputs.operation == 'run-cohort'
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
          SUPABASE_STORAGE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL || 'https://sunjfepvdzfknglrjwhm.supabase.co' }}
          STORAGE_SERVICE_KEY: ${{ secrets.STORAGE_SERVICE_KEY }}
          OPPORTUNITYOS_ENVIRONMENT: cloud
          OPPORTUNITYOS_TRUTH_PACK_PATH: founder/truth_pack.yaml.gz.b64
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python scripts/fr007_due_source_catchup.py
          --cohort-index "${{ inputs.cohort_index }}"
          ${{ inputs.maintenance_run_id != '' && format('--maintenance-run-id {0}', inputs.maintenance_run_id) || '' }}
          --state-file catchup-state/catchup-state.json
      - name: Verify final frozen-manifest and production invariants
        if: inputs.operation == 'finalize'
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
          SUPABASE_STORAGE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL || 'https://sunjfepvdzfknglrjwhm.supabase.co' }}
          STORAGE_SERVICE_KEY: ${{ secrets.STORAGE_SERVICE_KEY }}
          OPPORTUNITYOS_ENVIRONMENT: cloud
          OPPORTUNITYOS_TRUTH_PACK_PATH: founder/truth_pack.yaml.gz.b64
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/fr007_due_source_catchup.py --finalize --state-file catchup-state/catchup-state.json
      - name: Upload sanitized manifest and cohort checkpoint
        if: always() && hashFiles('catchup-state/catchup-state.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: fr007-overnight-catchup-state
          path: catchup-state/catchup-state.json
          if-no-files-found: error
          retention-days: 30
