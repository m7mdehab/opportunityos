name: FR-007 encrypted logical backup

on:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches:
      - main
      - work/fr007-overseer-integration
    paths:
      - .github/workflows/fr007-encrypted-backup.yml
  workflow_dispatch:
    inputs:
      acknowledge_backup:
        description: "Authorize a staging logical backup"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backup:
    if: ${{ inputs.acknowledge_backup == true }}
    environment: fr007-staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | gpg --dearmor \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg >/dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          pg_dump --version
      - name: Install repository dependencies
        run: python -m pip install -e .
      - name: Create and encrypt logical backup
        env:
          OPOS_SOURCE_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          mkdir -p backup-out
          python scripts/db_migration_restore.py backup --destination backup-out/source.dump
          python scripts/encrypted_backup.py encrypt \
            --input backup-out/source.dump \
            --output backup-out/backup.dump.enc \
            --manifest backup-out/backup.encrypted.manifest.json \
            --remove-plaintext
          test ! -e backup-out/source.dump
          python scripts/encrypted_backup.py verify \
            --archive backup-out/backup.dump.enc \
            --manifest backup-out/backup.encrypted.manifest.json
      - name: Record durable backup heartbeat
        env:
          OPOS_TARGET_DB_URL: ${{ secrets.OPOS_TARGET_DB_URL }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from sqlalchemy import create_engine, text

          manifest = json.load(open("backup-out/backup.encrypted.manifest.json", encoding="utf-8"))
          engine = create_engine(os.environ["OPOS_TARGET_DB_URL"], future=True)
          with engine.begin() as conn:
              conn.execute(text("""
                  INSERT INTO public.backup_heartbeats
                    (id, result, backup_completed_at, encryption, destination_class,
                     database_snapshot_sha, artifact_run_id, updated_at)
                  VALUES
                    ('latest', 'SUCCESS', :completed_at, true, 'github_actions_encrypted_artifact',
                     :sha, :run_id, :updated_at)
                  ON CONFLICT (id) DO UPDATE SET
                    result=EXCLUDED.result,
                    backup_completed_at=EXCLUDED.backup_completed_at,
                    encryption=EXCLUDED.encryption,
                    destination_class=EXCLUDED.destination_class,
                    database_snapshot_sha=EXCLUDED.database_snapshot_sha,
                    artifact_run_id=EXCLUDED.artifact_run_id,
                    updated_at=EXCLUDED.updated_at
              """), {
                  "completed_at": manifest.get("created_at") or datetime.now(timezone.utc).isoformat(),
                  "sha": manifest["sha256"],
                  "run_id": os.environ.get("GITHUB_RUN_ID"),
                  "updated_at": datetime.now(timezone.utc).isoformat(),
              })
          print("BACKUP_HEARTBEAT_RECORDED=PASS")
          PY
      - name: Upload encrypted backup only
        uses: actions/upload-artifact@v4
        with:
          name: fr007-encrypted-backup-${{ github.run_id }}
          path: |
            backup-out/backup.dump.enc
            backup-out/backup.encrypted.manifest.json
          if-no-files-found: error
