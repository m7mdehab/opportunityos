version: 1
default_policy: deny
action_classes:
  class_0_read_only:
    description: discover, fetch, normalize, rank, and summarize
    external_write: false
    enabled: true
  class_1_generate_only:
    description: generate local artifacts without external action
    external_write: false
    enabled: true
  class_2_prepare_external_action:
    description: prepare forms or messages without sending
    external_write: false
    enabled: false
  class_3_controlled_external_action:
    description: submit or send only for an explicitly approved adapter
    external_write: false
    enabled: false
  class_4_legal_or_commercial_commitment:
    description: tenders, contracts, binding offers, or sensitive declarations
    external_write: false
    enabled: false
adapter_permissions:
  - host: api.ted.europa.eu
    method: POST
    path: /v3/notices/search
    classification: READ_ONLY_QUERY
    authentication: none
    permitted_purpose: retrieval/search of published TED procurement notices only
    permitted_request_fields: [query, fields, page, limit, scope, checkQuerySyntax, paginationMode, iterationNextToken]
    prohibited_endpoints: [publication, validation, conversion, rendering, stop-publication]
