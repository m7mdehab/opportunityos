[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opportunityos"
version = "0.2.0"
description = "Autonomous opportunity-acquisition platform for MENA"
readme = "docs/STATE.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "OpportunityOS Team" }
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "python-docx>=1.1.0",
    "reportlab>=4.2.0",
    "pdfplumber>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "coverage>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "truth*",
    "opportunity*",
    "matching*",
    "outbound*",
    "inbox*",
    "storage*",
    "worker*",
    "core*",
    "feedback*",
    "security*",
    "recon*",
]
