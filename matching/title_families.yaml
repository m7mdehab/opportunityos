  - id: sales_account_management
    display_name: Sales / Account Management
    # Council review #2 finding (BRIEF-FR-006 B3): the founder-target-only
    # taxonomy measured 20.6% family coverage over the committed 540-payload
    # corpus. Sales/account roles ("Account Executive" and its many
    # regional/segment variants) are the single largest cluster in that
    # corpus (100+ titles) and were entirely unclassified. `other` must mean
    # "genuinely unclassifiable", not "outside the founder's target roles" --
    # relevance to the founder is title_family_fit's job, not this facet's.
    aliases:
      - "account executive"
      - "account manager"
      - "business development representative"
      - "business development manager"
      - "business development associate"
      - "sales development representative"
      - "channel account executive"
      - "client executive"
      - "inside sales"
      - "deal desk"
      - "sales manager"
      - "sales representative"
      - "sales lead"
      - "sales director"
    patterns:
      - '\baccounts?\s+(executive|manager|management)\b'
      - '\bbusiness\s+development\s+(representative|manager|associate|rep)\b'
      - '\bsales\s+(development\s+representative|representative|manager|lead|director|contractor)\b'
      - '\b(bdr|sdr)\b'
      - '\bclient\s+executive\b'
      - '\binside\s+sales\b'
      - '\bdeal\s+desk\b'
      - '\bdirector\b.*\b(sales|accounts?)\b'
      - '\b(sales|accounts?)\b.*\bdirector\b'
      - '\bsales?\s+(analyst|manager)\b'
    negative_patterns:
      - '\bengineer\b'
      - '\bsuccess\b'
      - '\bsupport\b'

