
# B3 (BRIEF-FR-006) -- committed target-role family definitions.
#
# `matching/title_family.py::normalize_title` loads this file and evaluates
# `families` in the order they appear here (list order, not dict/hash
# iteration order, so results are deterministic regardless of Python's dict
# implementation). For each family, `aliases` are checked before `patterns`,
# and within each list, entries are checked in the order written. The first
# family with a matching alias/pattern -- and no matching `negative_patterns`
# entry for that same family -- wins. `other` is the deliberate catch-all and
# must remain last with empty rule lists.
#
# All matching happens against a normalized copy of the title: casefolded,
# with every run of non-alphanumeric characters collapsed to a single space
# (see `title_family.py::_normalize_for_matching`). Aliases are plain phrases
# (matched as whole words via an auto-derived word-boundary regex); `patterns`
# are raw regexes evaluated with `re.search` against the same normalized text.
#
# Ordering rationale (specific families first, generic/broad ones last, so a
# narrower, more identifying family wins a title before a broader one gets a
# chance): customer/solutions engineering and ML/AI engineering are checked
# first because "engineer" alone is not diagnostic and these two are the
# collision pair the brief calls out by name (Customer Engineer vs Data
# Engineer; ML Engineer vs Sales Engineer). data_migration is checked before
# devops_platform so "cloud migration" wins over a generic "cloud" reading.
# `other` always resolves; nothing is ever left unresolved.

version: 1
families:
  - id: customer_solutions_engineering
    display_name: Customer / Solutions Engineering
    aliases:
      - "customer engineer"
      - "customer success engineer"
      - "solutions engineer"
      - "solution engineer"
      - "sales engineer"
      - "presales engineer"
      - "pre sales engineer"
      - "technical account manager"
      - "solutions consultant"
    patterns:
      - '\bcustomer\s+(success\s+)?engineer\b'
      - '\bsolutions?\s+engineer\b'
      - '\bsales\s+engineer\b'
      - '\b(pre\s*sales)\s+engineer\b'
      - '\btechnical\s+account\s+manager\b'
      - '\bsales\s+engineering\b'
    negative_patterns:
      - '\bdata\b'

  - id: ml_ai_engineering
    display_name: ML / AI Engineering
    aliases:
      - "machine learning engineer"
      - "ml engineer"
      - "ai engineer"
      - "artificial intelligence engineer"
